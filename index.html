  <style>
/* ============================================
   MY WORK BUDDY — calm editorial blue
   mobile-first · minimal · personal journal
   ============================================ */

:root{
  --bg:#F4F6FA;
  --surface:#FFFFFF;
  --surface-2:#EEF2F8;
  --surface-3:#E7ECF3;
  --ink:#1A2735;
  --ink-2:#4D5D70;
  --ink-3:#8A98AA;
  --ink-4:#B7C0CD;
  --line:#E3E9F1;
  --line-2:#EDF1F6;
  --blue:#4A6FA5;
  --blue-deep:#34547E;
  --blue-soft:#D7E2F1;
  --blue-tint:#E9EFF8;
  --blue-mist:#F2F5FB;
  --amber:#A77B45;
  --amber-soft:#F1E6D2;
  --green:#5E8770;
  --green-soft:#DCE7E0;
  --violet:#7868A0;
  --violet-soft:#E0D9EE;
  --radius:18px;
  --radius-sm:12px;
  --radius-xs:10px;
  --shadow-sm:0 1px 2px rgba(20,35,55,.04);
  --shadow:0 1px 2px rgba(20,35,55,.04), 0 8px 24px rgba(20,35,55,.06);
  --shadow-nav:0 -1px 1px rgba(20,35,55,.04), 0 -8px 28px rgba(20,35,55,.08);
  --tap:44px;
  --nav-h:62px;
  --serif:'Newsreader', Georgia, 'Times New Roman', serif;
  --sans:'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);
  color:var(--ink);
  background:var(--bg);
  font-size:15.5px;
  line-height:1.5;
  letter-spacing:-.005em;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overscroll-behavior-y:contain;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
input,textarea,select{font:inherit;color:inherit}
::selection{background:var(--blue-soft);color:var(--ink)}

/* App frame */
.app{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  min-height:100dvh;
  padding:
    calc(env(safe-area-inset-top, 0px) + 14px)
    18px
    calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 28px);
  position:relative;
}
.view{animation:fade .28s ease both}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* Typography */
.eyebrow{
  font-size:10.5px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--ink-3);
  font-weight:600;
}
.serif{font-family:var(--serif);font-weight:400}
.h-display{
  font-family:var(--serif);
  font-weight:400;
  letter-spacing:-.01em;
}
.date-serif{
  font-family:var(--serif);
  font-weight:300;
  font-size:34px;
  letter-spacing:-.015em;
  color:var(--ink);
  line-height:1.1;
}
.section-title{
  font-family:var(--sans);
  font-size:11px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--ink-3);
  font-weight:600;
  display:flex;
  align-items:center;
  gap:8px;
}
.section-title .dot{
  width:4px;height:4px;border-radius:50%;background:var(--blue);
}
.muted{color:var(--ink-2)}
.dim{color:var(--ink-3)}
.fine{color:var(--ink-3);font-size:12.5px}
.divider{height:1px;background:var(--line);margin:18px 0;border:0}

/* Cards */
.card{
  background:var(--surface);
  border-radius:var(--radius);
  padding:18px 18px;
  box-shadow:var(--shadow-sm);
  border:1px solid var(--line-2);
}
.card.tight{padding:14px 16px}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.card-link{display:block;cursor:pointer;transition:transform .15s ease}
.card-link:active{transform:scale(.995)}

/* Header bar */
.brand{
  display:flex;align-items:baseline;justify-content:space-between;
  margin:6px 0 18px;
}
.brand .mark{
  font-family:var(--serif);
  font-weight:400;
  font-size:18px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--ink);
}
.brand .mark span{color:var(--blue)}
.brand .right{font-size:12px;color:var(--ink-3)}

/* Home */
.home-hero{
  background:linear-gradient(160deg,#FFFFFF 0%, var(--blue-mist) 100%);
  border:1px solid var(--line-2);
  border-radius:var(--radius);
  padding:20px 20px 18px;
  margin-bottom:16px;
  box-shadow:var(--shadow-sm);
}
.home-hero .greeting{
  font-family:var(--serif);
  font-size:13px;
  color:var(--ink-2);
  font-style:italic;
}
.home-hero .date{font-family:var(--serif);font-weight:300;font-size:34px;line-height:1.15;letter-spacing:-.015em}
.home-hero .date small{font-size:18px;color:var(--ink-3);margin-left:6px;font-weight:300}
.home-hero .weekday{color:var(--ink-3);font-size:12.5px;letter-spacing:.04em;margin-top:4px}

.section{margin-top:22px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:0 4px 10px}
.section-head .section-title{margin:0}
.section-head .right{font-size:11.5px;color:var(--ink-3);letter-spacing:.04em}

.tile{
  background:var(--surface);
  border-radius:var(--radius);
  padding:16px 18px;
  border:1px solid var(--line-2);
  box-shadow:var(--shadow-sm);
}
.tile .label{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:8px}
.tile .body{font-size:14.5px;color:var(--ink);line-height:1.55}
.tile .body.serif{font-family:var(--serif);font-size:16px;font-weight:300}

.focus-tile{
  background:linear-gradient(170deg, var(--blue-soft) 0%, var(--blue-tint) 100%);
  border:1px solid #C9D6EA;
}
.focus-tile .label{color:var(--blue-deep)}
.focus-tile .body{color:var(--ink)}

.pain-tile{border-color:#E8DCC4;background:linear-gradient(170deg, #FBF5EA 0%, #F6EEDD 100%)}
.pain-tile .label{color:var(--amber)}
.pain-tile .body{color:var(--ink)}

.growth-tile{border-color:#D5E1D9;background:linear-gradient(170deg, #F2F7F3 0%, #E9F1EC 100%)}
.growth-tile .label{color:var(--green)}
.growth-tile .body{color:var(--ink)}

/* Lists */
.list{display:flex;flex-direction:column;gap:10px}
.row{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--surface);
  border:1px solid var(--line-2);
  border-radius:var(--radius-sm);
  padding:14px 16px;
  box-shadow:var(--shadow-sm);
  cursor:pointer;
  transition:transform .15s ease;
}
.row:active{transform:scale(.997)}
.row .left{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.row .name{font-weight:500;color:var(--ink);font-size:15px}
.row .meta{font-size:12px;color:var(--ink-3);margin-top:2px}
.row .chev{color:var(--ink-4);font-size:18px;line-height:1}
.tag{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11px;letter-spacing:.04em;
  background:var(--surface-2);
  color:var(--ink-2);
  padding:3px 9px;
  border-radius:999px;
  border:1px solid var(--line);
}
.tag.blue{background:var(--blue-tint);color:var(--blue-deep);border-color:#D4E0F0}
.tag.amber{background:var(--amber-soft);color:#7C582C;border-color:#ECDDC0}
.tag.green{background:var(--green-soft);color:#345640;border-color:#CFE0D5}
.tag.violet{background:var(--violet-soft);color:#4F406E;border-color:#D7CFEA}

/* Task detail */
.task-hero{
  background:var(--surface);
  border:1px solid var(--line-2);
  border-radius:var(--radius);
  padding:20px 20px 16px;
  box-shadow:var(--shadow-sm);
  margin-bottom:14px;
}
.task-hero .name{
  font-family:var(--serif);font-weight:400;font-size:26px;letter-spacing:-.01em;
}
.task-hero .stage{color:var(--blue-deep);font-size:13px;letter-spacing:.06em;margin-top:6px}
.task-hero .meta-line{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.task-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.task-field{
  background:var(--surface);
  border:1px solid var(--line-2);
  border-radius:var(--radius-sm);
  padding:12px 14px;
}
.task-field.full{grid-column:1/-1}
.task-field .l{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:5px}
.task-field .v{font-size:14px;color:var(--ink);line-height:1.5}
.task-field .v.empty{color:var(--ink-4);font-style:italic}

/* Timeline */
.timeline{display:flex;flex-direction:column;gap:14px;margin-top:6px}
.t-entry{
  position:relative;
  padding-left:22px;
}
.t-entry::before{
  content:"";
  position:absolute;left:6px;top:8px;bottom:-14px;
  width:1px;background:var(--line);
}
.t-entry:last-child::before{display:none}
.t-dot{
  position:absolute;left:0;top:6px;
  width:12px;height:12px;border-radius:50%;
  background:var(--surface);border:2px solid var(--blue);
}
.t-dot.fact{background:var(--blue);}
.t-dot.feeling{background:var(--violet);border-color:var(--violet);}
.t-dot.analysis{background:var(--green);border-color:var(--green);}

.t-card{
  background:var(--surface);
  border:1px solid var(--line-2);
  border-radius:var(--radius-sm);
  padding:14px 16px;
  box-shadow:var(--shadow-sm);
  cursor:pointer;
}
.t-date{
  font-family:var(--serif);
  font-weight:500;
  font-size:15px;
  color:var(--ink);
  display:flex;align-items:center;gap:8px;
}
.t-date .lens{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);font-family:var(--sans);font-weight:600;margin-left:6px}
.t-rows{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.t-row{display:grid;grid-template-columns:82px 1fr;gap:8px;font-size:14px}
.t-row .k{color:var(--ink-3);font-size:12px;letter-spacing:.04em}
.t-row .v{color:var(--ink);line-height:1.5;white-space:pre-wrap;word-break:break-word}
.t-row .v.empty{color:var(--ink-4);font-style:italic}
.t-scores{display:flex;gap:14px;margin-top:10px;color:var(--ink-2);font-size:12.5px}
.t-scores .score{display:flex;align-items:center;gap:6px}
.t-scores .score .num{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

/* Forms / New Log */
.sheet{
  background:var(--surface);
  border:1px solid var(--line-2);
  border-radius:var(--radius);
  padding:8px 18px 18px;
  box-shadow:var(--shadow-sm);
}
.field{margin-top:14px}
.field label{display:block;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:6px}
.field .hint{font-size:12px;color:var(--ink-3);margin-top:6px;line-height:1.5}
.input,.textarea,.select{
  width:100%;
  background:#FBFCFE;
  border:1px solid var(--line);
  border-radius:var(--radius-xs);
  padding:12px 14px;
  font-size:15px;
  color:var(--ink);
  outline:none;
  transition:border-color .15s ease, background .15s ease;
}
.input:focus,.textarea:focus,.select:focus{border-color:var(--blue);background:#fff}
.textarea{min-height:82px;resize:vertical;line-height:1.55}

.seg{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--surface-2);border-radius:999px;padding:3px;border:1px solid var(--line)}
.seg button{
  padding:9px 0;
  border-radius:999px;
  font-size:13px;
  font-weight:500;
  color:var(--ink-2);
  letter-spacing:.04em;
  transition:background .15s ease, color .15s ease;
}
.seg button.on.fact{background:var(--blue);color:#fff}
.seg button.on.feeling{background:var(--violet);color:#fff}
.seg button.on.analysis{background:var(--green);color:#fff}

.slider-row{display:flex;align-items:center;gap:12px}
.slider-row .val{
  font-family:var(--serif);font-weight:500;font-size:24px;color:var(--ink);
  width:38px;text-align:right;font-variant-numeric:tabular-nums;
}
.slider{
  -webkit-appearance:none;appearance:none;
  flex:1;height:6px;border-radius:999px;
  background:linear-gradient(90deg, var(--blue-soft), var(--blue-soft));
  outline:none;
}
.slider::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:24px;height:24px;border-radius:50%;background:var(--blue);
  border:3px solid #fff;box-shadow:0 1px 4px rgba(20,35,55,.18);
}
.slider::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--blue);border:3px solid #fff}

.actions{display:flex;gap:10px;margin-top:18px}
.btn{
  flex:1;display:inline-flex;align-items:center;justify-content:center;
  padding:13px 16px;border-radius:14px;font-weight:500;font-size:15px;
  letter-spacing:.01em;transition:transform .12s ease, background .12s ease;
}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 4px 14px rgba(74,111,165,.25)}
.btn-primary:active{background:var(--blue-deep)}
.btn-ghost{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.btn-danger{background:#fff;color:#9B4040;border:1px solid #EBC9C9}

/* Edit sheet (task fields) */
.edit-grid{display:grid;gap:10px}
.edit-grid label{font-size:12px;color:var(--ink-2)}
.edit-grid input,.edit-grid textarea{
  width:100%;border:1px solid var(--line);background:#FBFCFE;
  border-radius:var(--radius-xs);padding:10px 12px;font-size:14px;outline:none;
}
.edit-grid input:focus,.edit-grid textarea:focus{border-color:var(--blue);background:#fff}
.edit-grid textarea{min-height:64px;line-height:1.5}

/* Log view segments */
.segments{
  display:flex;background:var(--surface-2);
  border-radius:999px;padding:4px;border:1px solid var(--line);
  margin:6px 0 16px;
}
.segments button{
  flex:1;padding:9px 0;border-radius:999px;
  font-size:13px;font-weight:500;color:var(--ink-2);letter-spacing:.04em;
}
.segments button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow-sm)}

.filter-bar{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:8px;scrollbar-width:none}
.filter-bar::-webkit-scrollbar{display:none}
.chip{
  flex:none;padding:7px 13px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);
  font-size:12.5px;color:var(--ink-2);letter-spacing:.02em;
}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}

/* Progress view */
.before-after{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.ba-card{
  background:var(--surface);
  border:1px solid var(--line-2);
  border-radius:var(--radius-sm);
  padding:14px 16px;
}
.ba-card .h{font-family:var(--serif);font-size:17px;font-weight:400;color:var(--ink);margin-bottom:8px}
.ba-card .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ba-card .pair .cell{
  background:var(--blue-mist);
  border:1px solid #DEE6F1;
  border-radius:10px;
  padding:10px 12px;
}
.ba-card .pair .cell.after{background:#F1F7F2;border-color:#D9E5DD}
.ba-card .pair .cell .l{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:var(--ink-3);margin-bottom:4px}
.ba-card .pair .cell .t{font-size:13.5px;color:var(--ink);line-height:1.5}
.ba-card .pair .cell.before .l{color:var(--ink-3)}
.ba-card .pair .cell.after .l{color:var(--green)}

/* Trend chart */
.chart-wrap{
  background:var(--surface);
  border:1px solid var(--line-2);
  border-radius:var(--radius-sm);
  padding:14px 14px 10px;
}
.chart-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.chart-head .name{font-family:var(--serif);font-size:15px;color:var(--ink)}
.chart-head .legend{display:flex;gap:12px;font-size:11.5px;color:var(--ink-2)}
.chart-head .legend .l{display:flex;align-items:center;gap:5px}
.chart-head .legend .sw{width:10px;height:2px;border-radius:2px}
.chart-svg{width:100%;height:140px;display:block}
.chart-svg .axis{stroke:var(--line);stroke-width:1}
.chart-svg .grid{stroke:var(--line-2);stroke-width:1}
.chart-svg .pt-energy{stroke:var(--blue);fill:#fff;stroke-width:2}
.chart-svg .pt-focus{stroke:var(--violet);fill:#fff;stroke-width:2}

/* Insights */
.insight-card{
  background:var(--surface);
  border:1px solid var(--line-2);
  border-radius:var(--radius);
  padding:16px 18px;
  box-shadow:var(--shadow-sm);
}
.insight-card .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.insight-card .head .task{font-family:var(--serif);font-size:17px;color:var(--ink)}
.insight-card .head .count{
  font-family:var(--serif);font-size:22px;color:var(--blue);font-variant-numeric:tabular-nums;
}
.insight-card .desc{font-size:14px;color:var(--ink);line-height:1.55;margin-bottom:10px}
.insight-card .row-line{display:flex;gap:8px;flex-wrap:wrap}
.insight-card .row-line .meta{font-size:12px;color:var(--ink-2);line-height:1.5}
.insight-card .row-line .meta .k{color:var(--ink-3);font-weight:500}

.status-pill{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11.5px;letter-spacing:.06em;padding:3px 9px;border-radius:999px;
  border:1px solid var(--line);
}
.status-pill .d{width:6px;height:6px;border-radius:50%}
.status-pill.open{color:var(--amber);background:var(--amber-soft);border-color:#E7D2B0}
.status-pill.open .d{background:var(--amber)}
.status-pill.testing{color:var(--blue);background:var(--blue-tint);border-color:#CADBEF}
.status-pill.testing .d{background:var(--blue)}
.status-pill.resolved{color:var(--green);background:var(--green-soft);border-color:#CCDCCF}
.status-pill.resolved .d{background:var(--green)}

.empty{
  text-align:center;color:var(--ink-3);font-size:13px;padding:20px 14px;
  background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius-sm);
}

/* Nav */
.nav{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:0;width:100%;max-width:480px;
  background:rgba(255,255,255,.86);
  backdrop-filter:saturate(140%) blur(18px);
  -webkit-backdrop-filter:saturate(140%) blur(18px);
  border-top:1px solid var(--line);
  box-shadow:var(--shadow-nav);
  display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px 6px calc(env(safe-area-inset-bottom, 0px) + 6px);
  z-index:50;
}
.nav-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;padding:8px 4px;color:var(--ink-3);font-size:10.5px;letter-spacing:.04em;
  border-radius:12px;
}
.nav-btn .ico{width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.nav-btn.on{color:var(--blue-deep)}
.nav-btn.fab{
  position:relative;margin-top:-22px;
}
.nav-btn.fab .ico{
  width:50px;height:50px;border-radius:50%;
  background:var(--blue);
  color:#fff;
  box-shadow:0 6px 16px rgba(74,111,165,.35), inset 0 -2px 0 rgba(0,0,0,.05);
}
.nav-btn.fab.on .ico{background:var(--blue-deep)}

/* Toast */
.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 18px);
  background:var(--ink);color:#fff;font-size:13px;
  padding:10px 16px;border-radius:999px;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;
  transition:opacity .2s ease, transform .2s ease;
  z-index:60;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

/* Misc */
.spacer-sm{height:8px}
.spacer-md{height:16px}
.spacer-lg{height:28px}
.center{text-align:center}
.notes{font-size:12.5px;color:var(--ink-3);line-height:1.6}

/* Header w/ back */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  margin:2px 0 14px;
}
.topbar .back{
  width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  color:var(--ink-2);background:var(--surface);border:1px solid var(--line);
}
.topbar .title{font-family:var(--serif);font-size:18px;color:var(--ink);font-weight:500}

/* Weekly review */
.review-grid{display:grid;gap:10px}
.review-card{
  background:var(--surface);
  border:1px solid var(--line-2);
  border-radius:var(--radius);
  padding:18px 18px;
  box-shadow:var(--shadow-sm);
}
.review-card .h{font-family:var(--serif);font-size:18px;color:var(--ink);margin-bottom:4px}
.review-card .sub{font-size:12px;color:var(--ink-3);margin-bottom:12px}
.review-card .q{margin-top:10px}
.review-card .q .k{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:4px}
.review-card .q .v{font-size:14px;color:var(--ink);line-height:1.55;white-space:pre-wrap}
.review-card .q .v.empty{color:var(--ink-4);font-style:italic}
.review-card .sentence{
  font-family:var(--serif);font-style:italic;font-size:16px;
  color:var(--blue-deep);border-top:1px solid var(--line);margin-top:14px;padding-top:12px;
}

/* Inline tag selector for task edit status */
.status-row{display:flex;gap:6px;flex-wrap:wrap}

/* Animations & util */
.fadein{animation:fade .28s ease both}
.hide{display:none !important}
.scroll-x{overflow-x:auto;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}

/* Import modal */
.imp-tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:14px}
.imp-tab{flex:1;padding:10px 0;background:none;font-size:14px;color:var(--ink-3);border-bottom:2px solid transparent;cursor:pointer}
.imp-tab.on{color:var(--blue-deep);border-bottom-color:var(--blue);font-weight:600}
.imp-panel{padding-bottom:4px}
.imp-convos{max-height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:var(--radius-xs)}
.imp-conv{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.imp-conv:last-child{border-bottom:none}
.imp-conv input[type=checkbox]{margin-top:3px;accent-color:var(--blue)}
.imp-conv .ic-body{flex:1;min-width:0}
.imp-conv .ic-title{font-size:13.5px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imp-conv .ic-meta{font-size:12px;color:var(--ink-3);margin-top:2px}

/* Modal overlay (bottom sheet) */
.modal-overlay{
  position:fixed;inset:0;z-index:100;
  background:rgba(20,35,55,.42);
  backdrop-filter:blur(2px);
  -webkit-backdrop-filter:blur(2px);
  display:flex;align-items:flex-end;justify-content:center;
  overflow-y:auto;
  animation:fade .2s ease both;
}
.modal{
  width:100%;max-width:480px;max-height:88vh;overflow-y:auto;
  background:var(--surface);
  border-radius:20px 20px 0 0;
  padding:16px 18px calc(env(safe-area-inset-bottom, 0px) + 18px);
  box-shadow:0 -4px 30px rgba(20,35,55,.15);
  animation:sheetUp .26s ease both;
}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.modal .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.modal .head .t{font-family:var(--serif);font-size:19px;color:var(--ink);font-weight:500}
.modal .head .close{width:32px;height:32px;border-radius:50%;background:var(--surface-2);color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center}

/* Calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:0 4px 12px}
.cal-nav{width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);font-size:20px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.cal-nav:active{background:var(--surface-2)}
.cal-month{font-family:var(--serif);font-size:20px;color:var(--ink);font-weight:400}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:0;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius-sm);overflow:hidden;box-shadow:var(--shadow-sm)}
.cal-dw{text-align:center;font-size:11px;color:var(--ink-3);padding:8px 0 6px;font-weight:600;letter-spacing:.04em;background:var(--surface-2);border-bottom:1px solid var(--line-2)}
.cal-dw:first-child{color:var(--amber)}
.cal-cell{
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  min-height:54px;padding:6px 2px 5px;background:var(--surface);
  border:none;border-top:1px solid var(--line-2);border-left:1px solid var(--line-2);
  gap:3px;position:relative;text-align:center;
}
.cal-cell:nth-child(7n+1){border-left:none}
.cal-cell.out{background:var(--blue-mist)}
.cal-cell.out .cal-num{color:var(--ink-4)}
.cal-cell.today{background:var(--blue-tint)}
.cal-cell.today .cal-num{color:var(--blue-deep);font-weight:600}
.cal-cell:active{background:var(--surface-2)}
.cal-num{font-family:var(--serif);font-size:15px;color:var(--ink);line-height:1}
.cal-marks{display:flex;align-items:center;justify-content:center;gap:2px;flex-wrap:wrap;min-height:8px}
.cal-dot{width:5px;height:5px;border-radius:50%;display:inline-block}
.cal-dot.fact{background:var(--blue)}
.cal-dot.feeling{background:var(--violet)}
.cal-dot.analysis{background:var(--green)}
.cal-ic{display:inline-flex;align-items:center;justify-content:center;color:var(--ink-3)}
.cal-ic.img{color:var(--blue)}
.cal-ic.dia{color:var(--green)}
.cal-legend{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--ink-3);margin:8px 4px 0}
.cal-legend .cal-dot,.cal-legend .cal-ic{margin-right:1px}

/* Monthly summary */
.cal-sum{margin-top:18px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius-sm);padding:14px 16px;box-shadow:var(--shadow-sm)}
.cal-sum-title{font-family:var(--serif);font-size:16px;color:var(--ink);margin-bottom:10px}
.cal-sum-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line-2);font-size:13.5px}
.cal-sum-row:last-child{border-bottom:none}
.cal-sum-row span{color:var(--ink-2)}
.cal-sum-row b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:500}
.cal-sum-block{margin-top:10px;padding-top:10px;border-top:1px solid var(--line-2)}
.cal-sum-l{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:6px}
.cal-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.cal-bar-row .n{font-size:12.5px;color:var(--ink-2);width:54px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-bar-row .bar{flex:1;height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.cal-bar-row .bar>div{height:100%;border-radius:999px;background:var(--blue);opacity:.7}
.cal-bar-row b{font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums;width:20px;text-align:right}

/* Day view */
.day-hero{background:linear-gradient(160deg,#FFF 0%, var(--blue-mist) 100%);border:1px solid var(--line-2);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow-sm);display:flex;align-items:baseline;gap:10px}
.dh-num{font-family:var(--serif);font-weight:300;font-size:38px;line-height:1;color:var(--ink)}
.dh-meta{font-size:13px;color:var(--ink-3)}
.loc-row{display:flex;gap:8px}
.loc-row .input{flex:1}
.gps-badge{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:11.5px;color:var(--green);background:var(--green-soft);border:1px solid #CFE0D5;border-radius:999px;padding:4px 10px}

/* Memory cards grid */
.card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.mc{position:relative;border-radius:var(--radius-xs);overflow:hidden;aspect-ratio:1;background:var(--surface-2);box-shadow:var(--shadow-sm);cursor:pointer}
.mc img{width:100%;height:100%;object-fit:cover;display:block}
.mc-del{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;background:rgba(26,39,53,.55);color:#fff;display:inline-flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.mc-del:active{background:rgba(26,39,53,.8)}

/* Lightbox */
.lb-overlay{position:fixed;inset:0;z-index:100;background:rgba(15,22,32,.92);display:flex;align-items:center;justify-content:center;padding:30px;animation:fade .2s ease both}
.lb-inner{position:relative;max-width:100%;max-height:100%}
.lb-inner img{max-width:100%;max-height:75vh;border-radius:var(--radius-sm);display:block;box-shadow:0 8px 40px rgba(0,0,0,.4)}
.lb-close{position:absolute;top:-14px;right:-14px;width:36px;height:36px;border-radius:50%;background:#fff;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}

/* Todo list */
.todo-list{display:flex;flex-direction:column;gap:2px}
.todo-item{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line-2)}
.todo-item:last-child{border-bottom:none}
.todo-item.done{opacity:.48}
.todo-item.done .todo-text{text-decoration:line-through;text-decoration-color:var(--ink-3);text-decoration-thickness:1px}
.todo-check{
  width:24px;height:24px;flex:none;border-radius:7px;
  border:1.5px solid var(--ink-4);background:var(--surface);
  display:inline-flex;align-items:center;justify-content:center;color:#fff;
  transition:all .15s ease
}
.todo-check.checked{background:var(--blue);border-color:var(--blue)}
.todo-text{flex:1;font-size:14.5px;color:var(--ink);line-height:1.4;word-break:break-word}
.todo-del{width:26px;height:26px;flex:none;border-radius:50%;color:var(--ink-4);display:inline-flex;align-items:center;justify-content:center}
.todo-del:active{color:var(--amber);background:var(--amber-soft)}
.todo-add{display:flex;gap:8px;margin-top:10px}
.todo-add .input{flex:1}
.todo-add .chip{flex:none}
.todo-input::placeholder{color:var(--ink-4)}

/* Message to self */
.msg-self-section{margin-bottom:6px}
.msg-self{
  background:linear-gradient(160deg, var(--blue-mist) 0%, var(--surface) 100%);
  border:1px solid var(--blue-soft);
  border-radius:var(--radius);
  padding:14px 16px;
  box-shadow:var(--shadow-sm)
}
.msg-input{
  font-family:var(--serif);
  font-style:italic;
  font-size:16.5px;
  line-height:1.5;
  color:var(--blue-deep);
  background:transparent;
  border:none;
  resize:vertical
}
.msg-input:focus{outline:none}
.msg-input::placeholder{color:var(--ink-4);font-style:italic}

/* Small button */

<body>
  <div id="app" class="app"></div>

  <script>
/* ============================================================
   MY WORK BUDDY — 安静的个人学习工作台
   vanilla JS · localStorage · iPhone-first · 中文版
   ============================================================ */
(function(){
  'use strict';

  // ---------- storage keys ----------
  const K = { tasks:'mwb2.tasks', logs:'mwb2.logs', evidence:'mwb2.evidence', reviews:'mwb2.reviews', pain:'mwb2.painStatus', seeded:'mwb2.seeded', draft:'mwb2.draft', diary:'mwb2.diary', cards:'mwb2.cards', todos:'mwb2.todos' };

  // ---------- helpers ----------
  const $ = (s,r=document)=>r.querySelector(s);
  const uid = ()=> Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
  const esc = s => s==null?'':String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
  const trim = s => (s==null?'':String(s)).trim();
  const trunc = (s,n)=>{ s=trim(s); return s.length>n? s.slice(0,n-1)+'…' : s; };
  const todayISO = ()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
  const parseISO = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
  const wdays = ['周日','周一','周二','周三','周四','周五','周六'];
  const fmtMD = d => String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0');
  const fmtFullDate = iso => { const d=parseISO(iso); return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日'; };
  const fmtWeekday = iso => wdays[parseISO(iso).getDay()];
  const weekStart = ()=>{ const d=new Date(); const day=d.getDay(); const diff=day===0?6:day-1; d.setDate(d.getDate()-diff); d.setHours(0,0,0,0); return d.toISOString().slice(0,10); };
  const weekEnd = ()=>{ const d=new Date(); const day=d.getDay(); const diff=day===0?0:7-day; d.setDate(d.getDate()+diff); d.setHours(0,0,0,0); return d.toISOString().slice(0,10); };
  const weekNumber = d => { const date=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const dn=date.getUTCDay()||7; date.setUTCDate(date.getUTCDate()+4-dn); const ys=new Date(Date.UTC(date.getUTCFullYear(),0,1)); return Math.ceil((((date-ys)/86400000)+1)/7); };
  const weekKey = ()=>{ const s=weekStart(); return s.slice(0,4)+'-W'+String(weekNumber(parseISO(s))).padStart(2,'0'); };
  const avg = a => a.length? a.reduce((x,y)=>x+y,0)/a.length : 0;
  const load = k => { try { return JSON.parse(localStorage.getItem(k)||'null'); } catch { return null; } };
  const save = (k,v)=>{ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} };

  // ---------- 中文映射 ----------
  const LENS_LABEL = { fact:'事实', feeling:'感受', analysis:'分析' };
  const STATUS_LABEL = { active:'进行中', paused:'暂停', archived:'归档' };
  const PAIN_LABEL = { open:'待处理', testing:'试验中', resolved:'已解决' };

  // ---------- state ----------
  let state = { tasks:[], logs:[], evidence:[], reviews:[], painStatus:{}, diary:[], cards:[], todos:[] };
  function saveAll(){ save(K.tasks,state.tasks); save(K.logs,state.logs); save(K.evidence,state.evidence); save(K.reviews,state.reviews); save(K.pain,state.painStatus); save(K.diary,state.diary); save(K.cards,state.cards); save(K.todos,state.todos); }
  function loadAll(){
    state.tasks = load(K.tasks) || [];
    state.logs = load(K.logs) || [];
    state.evidence = load(K.evidence) || [];
    state.reviews = load(K.reviews) || [];
    state.painStatus = load(K.pain) || {};
    state.diary = load(K.diary) || [];
    state.cards = load(K.cards) || [];
    state.todos = load(K.todos) || [];
  }

  // ---------- defaults (first-run seed) ----------
  function defaults(){
    const now = new Date().toISOString();
    const tasks = [
      { id:'t-voc', name:'词汇', area:'词汇', stage:'认知 \u2192 运用',     focus:'把被动认知转成主动回忆和口语运用。', pain:'需要用的时候词出不来。',         strategy:'间隔回忆 + 24小时内造句。', milestone:'200个新词能在口语/写作中主动使用。', status:'active', createdAt:now, updatedAt:now },
      { id:'t-lis', name:'听力', area:'输入',   stage:'句子 \u2192 语篇', focus:'跟上较长的论述而不丢结构。',       pain:'长句处理速度慢。',           strategy:'按意群切分 + 提前读文稿。',            milestone:'连续听20分钟，保持80%理解。', status:'active', createdAt:now, updatedAt:now },
      { id:'t-rea', name:'阅读', area:'输入',   stage:'细节 \u2192 论证', focus:'读学术段落要看结构，不只看意思。', pain:'读了字却看不到论证。',     strategy:'每段标出主题句 + 两处论据推进。', milestone:'每天读一篇学术文章并做笔记。', status:'active', createdAt:now, updatedAt:now },
      { id:'t-wri', name:'写作', area:'输出',  stage:'句子 \u2192 文章', focus:'先把一个段落写清楚，再加长度。',       pain:'草稿容易发散。',                                 strategy:'起草前列3个要点 + 1个例子。', milestone:'25分钟写出一篇连贯的300词文章。', status:'active', createdAt:now, updatedAt:now },
      { id:'t-spe', name:'口语', area:'输出',  stage:'表达 \u2192 逻辑 \u2192 输出', focus:'不靠笔记持续表达。',       pain:'超过2分钟逻辑就散了。',            strategy:'开口前画论点脑图；用3个路标短语锚定。', milestone:'就熟悉话题连续说5分钟。', status:'active', createdAt:now, updatedAt:now },
      { id:'t-tra', name:'翻译', area:'输出',  stage:'直译 \u2192 忠实',  focus:'先传达意思，再打磨措辞。',           pain:'逐字翻译丢了意思。', strategy:'读完整句再重译。',   milestone:'30分钟翻译一段300词的文章。', status:'active', createdAt:now, updatedAt:now },
      { id:'t-int', name:'口译', area:'输出',  stage:'听辨 + 重述',focus:'在重述中保住主旨。',    pain:'信息密集时跟不上。',               strategy:'符号笔记 + 分段输出。', milestone:'对一段2分钟讲话做交传。', status:'active', createdAt:now, updatedAt:now },
    ];
    const logs = [
      { id:uid(), date:'2026-09-17', taskId:'t-spe', whatDid:'跟读TED演讲，15分钟。', evidence:'录音已存', difficulty:'快段跟不上。', feeling:'受鼓舞。', energy:6, focus:7, whatChanged:'第一次不暂停听完整个片段。', nextAdjust:'密集段落把源速降到0.75倍。', lens:'fact', createdAt:now, updatedAt:now },
      { id:uid(), date:'2026-09-19', taskId:'t-spe', whatDid:'用3个话题练习论点脑图。', evidence:'3张脑图', difficulty:'脑图画到一半变乱。', feeling:'平稳。', energy:5, focus:6, whatChanged:'画图速度略有提升。', nextAdjust:'每张脑图限制5个节点。', lens:'analysis', createdAt:now, updatedAt:now },
      { id:uid(), date:'2026-09-22', taskId:'t-spe', whatDid:'就熟悉话题录了一段3分钟即兴。', evidence:'录音 3:12', difficulty:'2:30后逻辑跑偏。', feeling:'沮丧但接近了一些。', energy:7, focus:8, whatChanged:'第一次突破了2分钟的墙。', nextAdjust:'每分钟用3个路标短语锚定。', lens:'feeling', createdAt:now, updatedAt:now },
      { id:uid(), date:'2026-09-15', taskId:'t-lis', whatDid:'听写一段2分钟BBC新闻。', evidence:'文本文件', difficulty:'长句打断我的节奏。', feeling:'疲惫。', energy:5, focus:6, whatChanged:'', nextAdjust:'提前读一遍文稿。', lens:'fact', createdAt:now, updatedAt:now },
      { id:uid(), date:'2026-09-18', taskId:'t-lis', whatDid:'播客笔记，20分钟。', evidence:'笔记', difficulty:'长句还是处理得慢。', feeling:'平静。', energy:6, focus:7, whatChanged:'更会抓话题了。', nextAdjust:'按7词一组练习切分。', lens:'fact', createdAt:now, updatedAt:now },
      { id:uid(), date:'2026-09-21', taskId:'t-lis', whatDid:'跟读讲座，30分钟。', evidence:'录音', difficulty:'长句处理速度慢。', feeling:'专注。', energy:6, focus:7, whatChanged:'切分意群略好一些。', nextAdjust:'提前读接下来3场讲座的文稿。', lens:'analysis', createdAt:now, updatedAt:now },
      { id:uid(), date:'2026-09-20', taskId:'t-voc', whatDid:'用句子复习了上周的30个词。', evidence:'写了20个句子', difficulty:'有些词还是用不起来。', feeling:'耐心。', energy:6, focus:7, whatChanged:'有8个词现在觉得能用了。', nextAdjust:'把那10个用不起来的放进明天的复习。', lens:'fact', createdAt:now, updatedAt:now },
    ];
    const evidence = [
      { id:uid(), taskId:'t-spe', ability:'连续表达',     before:'说不到30秒结构就散了。', after:'就熟悉话题连续说了3分钟独白。', date:'2026-09-22', createdAt:now },
      { id:uid(), taskId:'t-lis', ability:'长句切分', before:'逐词听，听到结尾意思就丢了。',     after:'能抓住意群并暂停追上，意思保住了。',     date:'2026-09-21', createdAt:now },
    ];
    const diary = [
      { id: uid(), date:'2026-09-17', text:'今天跟读TED，发现快段还是跟不上。但第一次没暂停听完整个片段，这点让我意外。', location:'宿舍', gps:null, messageToSelf:'慢一点也没关系，听完就是进步。', createdAt:now, updatedAt:now },
      { id: uid(), date:'2026-09-22', text:'录了3分钟即兴，2:30后逻辑跑偏。沮丧，但确实突破了2分钟的墙。下周一分钟一个锚点试试。', location:'图书馆三楼', gps:null, messageToSelf:'墙是用来突破的，不是用来撞的。换个方法。', createdAt:now, updatedAt:now },
    ];
    const today = todayISO();
    const wk = weekKey();
    const mk = today.slice(0,7);
    const todos = [
      { id: uid(), scope:'daily', periodKey: today, text:'听力 30分钟跟读', done:true, createdAt:now, completedAt:now },
      { id: uid(), scope:'daily', periodKey: today, text:'口语 录3分钟即兴', done:false, createdAt:now, completedAt:null },
      { id: uid(), scope:'weekly', periodKey: wk, text:'完成3次完整听力训练', done:false, createdAt:now, completedAt:null },
      { id: uid(), scope:'weekly', periodKey: wk, text:'整理本周高频痛点', done:false, createdAt:now, completedAt:null },
      { id: uid(), scope:'monthly', periodKey: mk, text:'突破口语连续表达5分钟', done:false, createdAt:now, completedAt:null },
      { id: uid(), scope:'monthly', periodKey: mk, text:'积累200个新词主动使用', done:false, createdAt:now, completedAt:null },
    ];
    return { tasks, logs, evidence, diary, cards:[], todos, reviews:[], painStatus:{ 't-lis':'open', 't-spe':'testing' } };
  }

  // ---------- icons ----------
  const ICON = {
    home: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>',
    list: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
    plus: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    clock:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    bulb: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a6 6 0 0 0-4 10.4c.7.6 1 1.5 1 2.4V16h6v-1.2c0-.9.3-1.8 1-2.4A6 6 0 0 0 12 2Z"/></svg>',
    chev: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>',
    back: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>',
    pen:  '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
    trash:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>',
    x:    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
    upload: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 9l5-5 5 5"/><path d="M12 4v12"/></svg>',
    download: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>',
    cal:  '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>',
    camera: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>',
    pin: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',

    check: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>'
  };

  // ---------- router ----------
  function parseHash(){
    const h = (location.hash||'#/home').replace(/^#/,'');
    const [path, qs] = h.split('?');
    const params = {};
    if (qs) qs.split('&').forEach(p=>{ if(!p) return; const [k,v='']=p.split('='); params[k]=decodeURIComponent(v); });
    return { path: path||'/home', params };
  }
  function go(path, params){
    let q = '';
    if (params) q = '?'+Object.entries(params).filter(([,v])=>v!==''&&v!=null).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
    location.hash = path + q;
  }
  function activeKey(path){
    if (path==='/'||path==='/home') return 'home';
    if (path==='/tasks'||path==='/task') return 'tasks';
    if (path==='/new') return 'new';
    if (path==='/log'||path==='/day') return 'log';
    if (path==='/insights'||path==='/weekly') return 'insights';
    return 'home';
  }
  function renderNav(path){
    const tabs = [
      { key:'home',     label:'首页',     path:'/home',     icon:ICON.home },
      { key:'tasks',    label:'任务',    path:'/tasks',    icon:ICON.list },
      { key:'new',      label:'',         path:'/new',      icon:ICON.plus, fab:true },
      { key:'log',      label:'记录',      path:'/log',      icon:ICON.cal },
      { key:'insights', label:'洞察', path:'/insights', icon:ICON.bulb }
    ];
    const active = activeKey(path);
    const html = tabs.map(t=>'<button class="nav-btn '+(t.fab?'fab':'')+' '+(t.key===active?'on':'')+'" data-go="'+t.path+'" aria-label="'+(t.label||'新建记录')+'"><span class="ico">'+t.icon+'</span>'+(t.label?'<span>'+t.label+'</span>':'')+'</button>').join('');
    $('#nav').innerHTML = html;
  }

  // ---------- trend chart (inline SVG) ----------
  function trendChart(logs){
    const w=320, h=140, pad=20;
    const data = logs.map(l=>({ date:l.date, e:l.energy||null, f:l.focus||null }));
    const xPos = i => pad + (data.length<=1? (w-pad*2)/2 : (i/(data.length-1))*(w-pad*2));
    const yPos = v => h-pad - ((v-1)/9)*(h-pad*2);
    const path = key => {
      const pts = data.map((d,i)=> d[key]!=null? [xPos(i), yPos(d[key])] : null).filter(Boolean);
      if (pts.length < 2) return '';
      return 'M '+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L ');
    };
    const dots = key => data.map((d,i)=> d[key]!=null? '<circle cx="'+xPos(i).toFixed(1)+'" cy="'+yPos(d[key]).toFixed(1)+'" r="3.6" fill="'+(key==='e'?'#4A6FA5':'#7868A0')+'" stroke="#fff" stroke-width="1.5"/>' : '').join('');
    return ''+
      '<svg class="chart-svg" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+
        '<line x1="'+pad+'" y1="'+(h-pad)+'" x2="'+(w-pad)+'" y2="'+(h-pad)+'" stroke="#E3E9F1" stroke-width="1"/>'+
        [3,5,7,9].map(v=>'<line x1="'+pad+'" y1="'+yPos(v).toFixed(1)+'" x2="'+(w-pad)+'" y2="'+yPos(v).toFixed(1)+'" stroke="#EDF1F6" stroke-dasharray="2 5"/>').join('')+
        '<path d="'+path('e')+'" fill="none" stroke="#4A6FA5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'+
        '<path d="'+path('f')+'" fill="none" stroke="#7868A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'+
        dots('e')+dots('f')+
        '<text x="'+pad+'" y="'+(h-4)+'" font-size="9.5" fill="#8A98AA" font-family="Inter">'+(data[0]?esc(data[0].date.slice(5)):'')+'</text>'+
        '<text x="'+(w-pad)+'" y="'+(h-4)+'" font-size="9.5" fill="#8A98AA" font-family="Inter" text-anchor="end">'+(data.length? esc(data[data.length-1].date.slice(5)) : '')+'</text>'+
      '</svg>';
  }

  // ---------- shared bits ----------
  function rowItem(k, v){
    const empty = !trim(v);
    return '<div class="t-row"><div class="k">'+k+'</div><div class="v '+(empty?'empty':'')+'">'+esc(v||'\u2014')+'</div></div>';
  }
  function timelineEntry(l, editable){
    const lens = l.lens || 'fact';
    const lensLabel = LENS_LABEL[lens] || lens;
    const t = state.tasks.find(x=>x.id===l.taskId);
    const editAttr = editable? 'data-act="edit-log" data-id="'+l.id+'"' : '';
    return ''+
      '<div class="t-entry">'+

  let _dayDate = null;

  const idb = {
    _db: null,
    open(){
      if (this._db) return Promise.resolve(this._db);
      return new Promise((res, rej) => {
        const req = indexedDB.open('mwb2-img', 1);
        req.onupgradeneeded = e => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('images')) db.createObjectStore('images');
        };
        req.onsuccess = e => { this._db = e.target.result; res(this._db); };
        req.onerror = e => rej(e.target.error);
      });
    },
    async put(key, blob){
      const db = await this.open();
      return new Promise((res, rej) => {
        const tx = db.transaction('images', 'readwrite');
        tx.objectStore('images').put(blob, key);
        tx.oncomplete = () => res(key);
        tx.onerror = () => rej(tx.error);
      });
    },
    async get(key){
      const db = await this.open();
      return new Promise((res, rej) => {
        const tx = db.transaction('images', 'readonly');
        const r = tx.objectStore('images').get(key);
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    },
    async del(key){
      const db = await this.open();
      return new Promise((res, rej) => {
        const tx = db.transaction('images', 'readwrite');
        tx.objectStore('images').delete(key);
        tx.oncomplete = () => res();
        tx.onerror = () => rej(tx.error);
      });
    }
  };

  function loadImageFromFile(file){
    return new Promise((res, rej) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => { URL.revokeObjectURL(url); res(img); };
      img.onerror = e => { URL.revokeObjectURL(url); rej(e); };
      img.src = url;
    });
  }
  function canvasToBlob(canvas, quality){
    return new Promise(res => canvas.toBlob(b => res(b), 'image/jpeg', quality));
  }
  async function processImageFile(file){
    const img = await loadImageFromFile(file);
    let w = img.naturalWidth || img.width;
    let h = img.naturalHeight || img.height;
    const s1 = Math.min(1, 1280 / Math.max(w, h));
    const c1 = document.createElement('canvas');
    c1.width = Math.round(w * s1); c1.height = Math.round(h * s1);
    c1.getContext('2d').drawImage(img, 0, 0, c1.width, c1.height);
    const blob = await canvasToBlob(c1, 0.72);
    const s2 = Math.min(1, 240 / Math.max(w, h));
    const c2 = document.createElement('canvas');
    c2.width = Math.round(w * s2); c2.height = Math.round(h * s2);
    c2.getContext('2d').drawImage(img, 0, 0, c2.width, c2.height);
    const thumb = c2.toDataURL('image/jpeg', 0.55);
    return { blob, thumb };
  }
  function blobToBase64(blob){
    return new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(blob); });
  }
  function dataURLtoBlob(dataURL){
    const [head, body] = dataURL.split(',');
    const mime = (head.match(/:(.*?);/) || [])[1] || 'image/jpeg';
    const bin = atob(body);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
  }

  function renderCalendar(mParam){
    const today = todayISO();
    let year, month;
    if (mParam && /^\d{4}-\d{2}$/.test(mParam)){
      const [y, mo] = mParam.split('-').map(Number);
      year = y; month = mo - 1;
    } else {
      const d = new Date();
      year = d.getFullYear(); month = d.getMonth();
    }
    const monthKey = year + '-' + String(month + 1).padStart(2, '0');
    const monthName = year + '年' + (month + 1) + '月';
    const prev = new Date(year, month - 1, 1);
    const next = new Date(year, month + 1, 1);
    const prevKey = prev.getFullYear() + '-' + String(prev.getMonth() + 1).padStart(2, '0');
    const nextKey = next.getFullYear() + '-' + String(next.getMonth() + 1).padStart(2, '0');

    const dayMap = {};
    const ensure = d => { if (!dayMap[d]) dayMap[d] = { logs: [], diary: null, cards: [], todos: [] }; return dayMap[d]; };
    state.logs.forEach(l => { if (l.date) ensure(l.date).logs.push(l); });
    state.diary.forEach(d => { if (d.date) ensure(d.date).diary = d; });
    state.cards.forEach(c => { if (c.date) ensure(c.date).cards.push(c); });
    state.todos.forEach(t => { if (t.scope==='daily' && t.periodKey) ensure(t.periodKey).todos.push(t); });

    const startOffset = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const prevDays = new Date(year, month, 0).getDate();
    const dw = ['日', '一', '二', '三', '四', '五', '六'];
    const cells = [];
    for (let i = startOffset - 1; i >= 0; i--){
      cells.push({ date: new Date(year, month - 1, prevDays - i), inMonth: false });
    }
    for (let d = 1; d <= daysInMonth; d++){
      cells.push({ date: new Date(year, month, d), inMonth: true });
    }
    while (cells.length < 42){
      const d = cells.length - startOffset - daysInMonth + 1;
      cells.push({ date: new Date(year, month + 1, d), inMonth: false });
    }
    cells.length = 42;

    const cellHTML = cells.map(cell => {
      const iso = cell.date.getFullYear() + '-' + String(cell.date.getMonth() + 1).padStart(2, '0') + '-' + String(cell.date.getDate()).padStart(2, '0');
      const data = dayMap[iso];
      const isToday = iso === today;
      let marks = '';
      if (data){
        const lensSet = Array.from(new Set(data.logs.map(l => l.lens || 'fact')));
        marks += lensSet.map(ll => '<span class="cal-dot ' + ll + '"></span>').join('');
        if (data.cards.length) marks += '<span class="cal-ic img">' + ICON.img + '</span>';
        if (data.diary && (trim(data.diary.text) || trim(data.diary.messageToSelf))) marks += '<span class="cal-ic dia">' + ICON.pen + '</span>';
        if (data.todos.length) marks += '<span class="cal-ic todo">' + ICON.check + '</span>';
      }
      return '<button class="cal-cell' + (cell.inMonth ? '' : ' out') + (isToday ? ' today' : '') + '" data-go="/day?date=' + iso + '">' +
        '<span class="cal-num">' + cell.date.getDate() + '</span>' +
        '<span class="cal-marks">' + marks + '</span>' +
        '</button>';
    }).join('');

    const mLogs = state.logs.filter(l => l.date && l.date.slice(0, 7) === monthKey);
    const mDiary = state.diary.filter(d => d.date && d.date.slice(0, 7) === monthKey);
    const mCards = state.cards.filter(c => c.date && c.date.slice(0, 7) === monthKey);
    const tCounts = {};
    mLogs.forEach(l => { tCounts[l.taskId] = (tCounts[l.taskId] || 0) + 1; });
    const topTasks = Object.entries(tCounts).sort((a, b) => b[1] - a[1]).slice(0, 4)
      .map(([id, n]) => ({ name: (state.tasks.find(t => t.id === id) || {}).name || '?', n })).filter(x => x.name !== '?');
    const lCounts = {};
    mDiary.forEach(d => { const loc = trim(d.location); if (loc) lCounts[loc] = (lCounts[loc] || 0) + 1; });
    const topLocs = Object.entries(lCounts).sort((a, b) => b[1] - a[1]);
    const dCounts = {};
    mLogs.forEach(l => { const dd = trim(l.difficulty); if (dd) dCounts[dd] = (dCounts[dd] || 0) + 1; });
    const topDiffs = Object.entries(dCounts).sort((a, b) => b[1] - a[1]).slice(0, 3);
    const avgE = avg(mLogs.map(l => l.energy).filter(Boolean));
    const avgF = avg(mLogs.map(l => l.focus).filter(Boolean));

    return '' +
      '<div class="cal-head">' +
        '<button class="cal-nav" data-go="/log?seg=calendar&m=' + prevKey + '">\u2039</button>' +
        '<div class="cal-month">' + monthName + '</div>' +
        '<button class="cal-nav" data-go="/log?seg=calendar&m=' + nextKey + '">\u203a</button>' +
      '</div>' +
      '<div class="cal-grid">' +
        dw.map(w => '<div class="cal-dw">' + w + '</div>').join('') +
        cellHTML +
      '</div>' +
      '<div class="cal-legend">' +
        '<span class="cal-dot fact"></span>事实' +
        '<span class="cal-dot feeling"></span>感受' +
        '<span class="cal-dot analysis"></span>分析' +
        '<span class="cal-ic">' + ICON.img + '</span>图片' +
        '<span class="cal-ic">' + ICON.pen + '</span>日记' +
        '<span class="cal-ic">' + ICON.check + '</span>待办' +
      '</div>' +
      '<div class="cal-sum">' +
        '<div class="cal-sum-title">本月概览</div>' +
        '<div class="cal-sum-row"><span>日记</span><b>' + mDiary.length + ' 篇</b></div>' +
        '<div class="cal-sum-row"><span>记录</span><b>' + mLogs.length + ' 条</b></div>' +
        '<div class="cal-sum-row"><span>记忆卡片</span><b>' + mCards.length + ' 张</b></div>' +
        (avgE ? '<div class="cal-sum-row"><span>平均精力</span><b>' + avgE.toFixed(1) + '/10</b></div>' : '') +
        (avgF ? '<div class="cal-sum-row"><span>平均专注</span><b>' + avgF.toFixed(1) + '/10</b></div>' : '') +
        (topTasks.length ? '<div class="cal-sum-block"><div class="cal-sum-l">任务分布</div>' + topTasks.map(t => '<div class="cal-bar-row"><span class="n">' + esc(t.name) + '</span><div class="bar"><div style="width:' + (t.n / topTasks[0].n * 100) + '%"></div></div><b>' + t.n + '</b></div>').join('') + '</div>' : '') +
        (topLocs.length ? '<div class="cal-sum-block"><div class="cal-sum-l">地点分布</div>' + topLocs.map(function(a){ return '<div class="cal-sum-row"><span>' + esc(a[0]) + '</span><b>' + a[1] + ' 次</b></div>'; }).join('') + '</div>' : '') +
        (topDiffs.length ? '<div class="cal-sum-block"><div class="cal-sum-l">反复困难</div>' + topDiffs.map(function(a){ return '<div class="cal-sum-row"><span>' + esc(trunc(a[0], 36)) + '</span><b>' + a[1] + '</b></div>'; }).join('') + '</div>' : '') +
        (!mLogs.length && !mDiary.length && !mCards.length ? '<div class="empty" style="margin-top:8px">本月还没有记录。点击日历上的日期开始写。</div>' : '') +
      '</div>' +
      renderTodoList('monthly', monthKey);
  }

  // global click delegation (set up once)
  function onClick(e){
    const goBtn = e.target.closest('[data-go]');
    if (goBtn && !goBtn.disabled){ e.preventDefault(); go(goBtn.dataset.go); return; }
    const actBtn = e.target.closest('[data-act]');
    if (actBtn){ e.preventDefault(); handleAction(actBtn); return; }
  }

  function handleAction(b){
    const act = b.dataset.act;
    if (act === 'save-log') return saveLog(b.dataset.id || '');
    if (act === 'delete-log') return deleteLog(b.dataset.id);
    if (act === 'add-task') return openAddTask();
    if (act === 'edit-task') return openEditTask(b.dataset.id);
    if (act === 'add-evidence') return openAddEvidence(b.dataset.id);
    if (act === 'del-evidence') return delEvidence(b.dataset.id);
    if (act === 'edit-log') return go('/new?id='+b.dataset.id);
    if (act === 'set-pain'){ state.painStatus[b.dataset.id] = b.dataset.status; saveAll(); toast('痛点状态已更新。'); render(); return; }
    if (act === 'save-review') return saveReview(b.dataset.week);
    if (act === 'open-import') return openImport();
    if (act === 'export-data') return exportData();
    if (act === 'restore-data') return openRestore();
    if (act === 'save-diary') return saveDiary(b.dataset.date);
    if (act === 'save-msg') return saveMessageToSelf(b.dataset.date);
    if (act === 'add-todo'){ addTodo(b.dataset.scope, b.dataset.period, ($('#'+b.dataset.input)||{}).value || ''); toast('已添加。'); render(); return; }
    if (act === 'toggle-todo'){ toggleTodo(b.dataset.id); render(); return; }
    if (act === 'del-todo'){ delTodo(b.dataset.id); toast('已删除。'); render(); return; }
    if (act === 'view-card') return viewCard(b.dataset.id);
    if (act === 'del-card') return deleteCard(b.dataset.id);
  }

  // ---------- modal ----------
  function openModal(contentHTML, onMount){
    const ov = document.createElement('div');
    ov.className = 'modal-overlay';
    ov.innerHTML = '<div class="modal" role="dialog">'+contentHTML+'</div>';
    document.body.appendChild(ov);
    document.body.style.overflow = 'hidden';
    const close = () => { ov.remove(); document.body.style.overflow = ''; };
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    if (onMount) onMount(ov, close);
    return close;
  }

  function parseChatGPT(data){
    if (!Array.isArray(data)) return [];
    return data.map(conv => {
      const mapping = conv.mapping || {};
      let rootKey = null;
      for (const [k, node] of Object.entries(mapping)) {
        if (node.parent === null || node.parent === undefined) { rootKey = k; break; }
      }
      const messages = [];
      let cur = rootKey;
      const seen = new Set();
      let guard = 0;
      while (cur && !seen.has(cur) && guard < 5000) {
        seen.add(cur); guard++;
        const node = mapping[cur];
        if (node && node.message && node.message.author && node.message.content) {
          const role = node.message.author.role;
          const parts = node.message.content.parts || [];
          const text = (Array.isArray(parts)?parts:[]).filter(p => typeof p === 'string').join('').trim();
          if (text && (role === 'user' || role === 'assistant')) {
            messages.push({ role, text });
          }
        }
        cur = node && node.children && node.children[0];
      }
      const title = conv.title || (messages[0] ? trunc(messages[0].text, 50) : '未命名对话');
      const ts = conv.create_time ? new Date(conv.create_time * 1000) : new Date();
      const date = ts.getFullYear()+'-'+String(ts.getMonth()+1).padStart(2,'0')+'-'+String(ts.getDate()).padStart(2,'0');
      return { title, date, messages, createTime: conv.create_time };
    }).filter(c => c.messages.length > 0);
  }

  async function exportData(){
    toast('准备备份…');
    const imgData = {};
    for (const c of state.cards){
      try { const blob = await idb.get(c.id); if (blob) imgData[c.id] = await blobToBase64(blob); } catch (e) {}
    }
    const backup = {
      version: 3, app: 'MY WORK BUDDY', exportedAt: new Date().toISOString(),
      tasks: state.tasks, logs: state.logs, evidence: state.evidence,
      reviews: state.reviews, painStatus: state.painStatus,
      diary: state.diary, cards: state.cards, todos: state.todos, images: imgData
    };
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'work-buddy-backup-'+todayISO()+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    toast('备份已下载。');
  }

  function openRestore(){
    const html = ''+
      '<div class="head"><div class="t">恢复备份</div><button class="close" data-modal-close>'+ICON.x+'</button></div>'+
      '<div class="hint" style="margin-bottom:10px">选择之前导出的备份文件。这会<strong>替换</strong>当前全部数据。</div>'+
      '<div class="field"><label>选择备份 JSON</label><input type="file" id="restore-input" accept=".json" style="font-size:13px"></div>'+
      '<div id="restore-info" style="margin-top:6px"></div>'+
      '<div class="actions" id="restore-actions" style="display:none"><button class="btn btn-ghost" data-modal-close>取消</button><button class="btn btn-danger" id="restore-go">确认替换</button></div>';
    openModal(html, (ov, close) => {
      ov.querySelectorAll('[data-modal-close]').forEach(b => b.addEventListener('click', close));
      let backup = null;
      ov.querySelector('#restore-input').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const data = JSON.parse(reader.result);
            if (!data.tasks || !data.logs){ toast('这不是有效的备份文件。'); return; }
            backup = data;
            const info = ov.querySelector('#restore-info');
            info.innerHTML = '<div class="muted" style="font-size:12.5px">该备份包含 '+data.tasks.length+' 个任务、'+data.logs.length+' 条记录、'+(data.diary?data.diary.length:0)+' 篇日记、'+(data.cards?data.cards.length:0)+' 张图片。导出于 '+esc(trunc(data.exportedAt||'',10))+'。</div>';
            ov.querySelector('#restore-actions').style.display = '';
          } catch(err){ toast('文件解析失败。'); }
        };
        reader.readAsText(file);
      });
      ov.querySelector('#restore-go').addEventListener('click', async () => {
        if (!backup){ toast('请先选择备份文件。'); return; }
        if (!confirm('确认用备份替换当前全部数据？此操作不可撤销。')) return;
        state.tasks = backup.tasks || [];
        state.logs = backup.logs || [];
        state.evidence = backup.evidence || [];
        state.reviews = backup.reviews || [];
        state.painStatus = backup.painStatus || {};
        state.diary = backup.diary || [];
        state.cards = backup.cards || [];
        state.todos = backup.todos || [];
        saveAll();
        if (backup.images){
          toast('恢复图片…');
          for (const entry of Object.entries(backup.images)){
            try { await idb.put(entry[0], dataURLtoBlob(entry[1])); } catch (e) {}
          }
        }
        close();
        toast('数据已恢复。');
        go('/home');
      });
    });
  }

  // ---------- log actions ----------
  function saveLog(id){
    const data = {
      date: ($('#f-date')||{}).value || todayISO(),
      taskId: ($('#f-task')||{}).value,
      whatDid: trim(($('#f-did')||{}).value),
      evidence: trim(($('#f-evi')||{}).value),
      difficulty: trim(($('#f-diff')||{}).value),
      feeling: trim(($('#f-feel')||{}).value),
      energy: +(($('#f-energy')||{}).value || 5),
      focus: +(($('#f-focus')||{}).value || 5),
      whatChanged: trim(($('#f-changed')||{}).value),
      nextAdjust: trim(($('#f-adjust')||{}).value),
      lens: ((document.querySelector('#f-lens button.on')||{}).dataset||{}).lens || 'fact'
    };
    if (!data.taskId){ toast('请选择一个任务。'); return; }
    const now = new Date().toISOString();
    if (id){
      const i = state.logs.findIndex(l=>l.id===id);
      if (i<0) return;
      state.logs[i] = Object.assign({}, state.logs[i], data, { updatedAt: now });
    } else {
      state.logs.push({ id: uid(), createdAt: now, updatedAt: now, ...data });
    }
    const t = state.tasks.find(x=>x.id===data.taskId);
    if (t) t.updatedAt = now;
    saveAll();
    toast(id ? '记录已更新。' : '已保存到时间线。');
    go('/task?id='+data.taskId);
  }
  function deleteLog(id){
    const l = state.logs.find(x=>x.id===id);
    if (!l) return;
    if (!confirm('删除这条记录？')) return;
    state.logs = state.logs.filter(x=>x.id!==id);
    saveAll();
    toast('记录已删除。');
    go('/task?id='+l.taskId);
  }

  function saveReview(wk){
    const r = state.reviews.find(x=>x.weekKey===wk) || { id: uid(), weekKey: wk, startDate: weekStart(), endDate: weekEnd() };
    r.whatHappened = trim(($('#r-happened')||{}).value);
    r.whatImproved = trim(($('#r-improved')||{}).value);
    r.whatBlocked = trim(($('#r-blocked')||{}).value);
    r.whatWorked = trim(($('#r-worked')||{}).value);
    r.whatDidnt = trim(($('#r-didnt')||{}).value);
    r.whatWillChange = trim(($('#r-change')||{}).value);
    r.sentence = trim(($('#r-sentence')||{}).value);
    r.updatedAt = new Date().toISOString();
    const i = state.reviews.findIndex(x=>x.weekKey===wk);
    if (i<0) state.reviews.push(r); else state.reviews[i] = r;
    saveAll();
    toast('复盘已保存。');
    go('/insights');
  }

  function toast(msg){
    const el = $('#toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(()=> el.classList.remove('show'), 1600);
  }

  // ---------- per-view handlers ----------
  function attachHandlers(){
    // sliders: live update value display
    document.querySelectorAll('.slider').forEach(s => {
      s.addEventListener('input', () => {
        const v = s.parentElement.querySelector('.val');
        if (v) v.textContent = s.value;
      });
    });
    // lens segmented control
    document.querySelectorAll('#f-lens button').forEach(b => {
      b.addEventListener('click', () => {
        document.querySelectorAll('#f-lens button').forEach(x => { x.className = x.dataset.lens; });
        b.className = 'on ' + b.dataset.lens;
      });
    });
    // day view: GPS button
    const gpsBtn = $('#day-gps');
    if (gpsBtn){
      gpsBtn.addEventListener('click', () => {
        if (!navigator.geolocation){ toast('设备不支持定位。'); return; }
        toast('获取位置…');
        navigator.geolocation.getCurrentPosition(
          pos => {
            _pendingGps = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            const badge = $('#gps-badge');
            if (badge){
              badge.style.display = '';
              badge.innerHTML = ICON.pin + ' 已记录坐标 ' + _pendingGps.lat.toFixed(4) + ', ' + _pendingGps.lng.toFixed(4);
            }
            toast('已记录当前位置。');
          },
          () => { toast('定位失败。'); },
          { enableHighAccuracy: false, timeout: 8000 }
        );
      });
    }
    // day view: memory card file input
    const cardFile = document.getElementById('card-file');
    if (cardFile){
      cardFile.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) addCardFromFile(file, _dayDate);
        e.target.value = '';
      });
    }
    // todo inputs: enter to add
    document.querySelectorAll('.todo-input').forEach(inp => {
      inp.addEventListener('keydown', (e) => {
        if (e.key === 'Enter'){
          e.preventDefault();
          const btn = inp.parentElement.querySelector('[data-act="add-todo"]');
          if (btn){ btn.click(); }
        }
      });
    });
  }

  // ---------- init ----------
  function init(){
    loadAll();
    if (!state.tasks.length && !state.logs.length){
      const d = defaults();
      state.tasks = d.tasks;
      state.logs = d.logs;
      state.evidence = d.evidence;
      state.painStatus = d.painStatus;
      state.diary = d.diary;
      state.cards = d.cards;
      state.todos = d.todos;
      saveAll();
      try{ localStorage.setItem(K.seeded,'1'); }catch{}
    }
    document.body.addEventListener('click', onClick);
    window.addEventListener('hashchange', render);
    render();
  }

  init();
})();

  </script>
