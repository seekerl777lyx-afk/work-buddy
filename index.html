  <style>
/* ============================================
   MY WORK BUDDY — calm editorial blue
   mobile-first · minimal · personal journal
   ============================================ */

:root{
  --bg:#F4F6FA;
  --surface:#FFFFFF;
  --surface-2:#EEF2F8;
  --surface-3:#E7ECF3;
  --ink:#1A2735;
  --ink-2:#4D5D70;
  --ink-3:#8A98AA;
  --ink-4:#B7C0CD;
  --line:#E3E9F1;
  --line-2:#EDF1F6;
  --blue:#4A6FA5;
  --blue-deep:#34547E;
  --blue-soft:#D7E2F1;
  --blue-tint:#E9EFF8;
  --blue-mist:#F2F5FB;
  --amber:#A77B45;
  --amber-soft:#F1E6D2;
  --green:#5E8770;
  --green-soft:#DCE7E0;
  --violet:#7868A0;
  --violet-soft:#E0D9EE;
  --radius:18px;
  --radius-sm:12px;
  --radius-xs:10px;
  --shadow-sm:0 1px 2px rgba(20,35,55,.04);
  --shadow:0 1px 2px rgba(20,35,55,.04), 0 8px 24px rgba(20,35,55,.06);
  --shadow-nav:0 -1px 1px rgba(20,35,55,.04), 0 -8px 28px rgba(20,35,55,.08);
  --tap:44px;
  --nav-h:62px;
  --serif:'Newsreader', Georgia, 'Times New Roman', serif;
  --sans:'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);
  color:var(--ink);
  background:var(--bg);
  font-size:15.5px;
  line-height:1.5;
  letter-spacing:-.005em;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overscroll-behavior-y:contain;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
input,textarea,select{font:inherit;color:inherit}
::selection{background:var(--blue-soft);color:var(--ink)}

/* App frame */
.app{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  min-height:100dvh;
  padding:
    calc(env(safe-area-inset-top, 0px) + 14px)
    18px
    calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 28px);
  position:relative;
}
.view{animation:fade .28s ease both}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* Typography */
.eyebrow{
  font-size:10.5px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--ink-3);
  font-weight:600;
}
.serif{font-family:var(--serif);font-weight:400}
.h-display{
  font-family:var(--serif);
  font-weight:400;
  letter-spacing:-.01em;
}
.date-serif{
  font-family:var(--serif);
  font-weight:300;
  font-size:34px;
  letter-spacing:-.015em;
  color:var(--ink);
  line-height:1.1;
}
.section-title{
  font-family:var(--sans);
  font-size:11px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--ink-3);
  font-weight:600;
  display:flex;
  align-items:center;
  gap:8px;
}
.section-title .dot{
  width:4px;height:4px;border-radius:50%;background:var(--blue);
}
.muted{color:var(--ink-2)}
.dim{color:var(--ink-3)}
.fine{color:var(--ink-3);font-size:12.5px}
.divider{height:1px;background:var(--line);margin:18px 0;border:0}

/* Cards */
.card{
  background:var(--surface);
  border-radius:var(--radius);
  padding:18px 18px;
  box-shadow:var(--shadow-sm);
  border:1px solid var(--line-2);
}
.card.tight{padding:14px 16px}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.card-link{display:block;cursor:pointer;transition:transform .15s ease}
.card-link:active{transform:scale(.995)}

/* Header bar */
.brand{
  display:flex;align-items:baseline;justify-content:space-between;
  margin:6px 0 18px;
}
.brand .mark{
  font-family:var(--serif);
  font-weight:400;
  font-size:18px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--ink);
}
.brand .mark span{color:var(--blue)}
.brand .right{font-size:12px;color:var(--ink-3)}

/* Home */
.home-hero{
  background:linear-gradient(160deg,#FFFFFF 0%, var(--blue-mist) 100%);
  border:1px solid var(--line-2);
  border-radius:var(--radius);
  padding:20px 20px 18px;
  margin-bottom:16px;
  box-shadow:var(--shadow-sm);
}
.home-hero .greeting{
  font-family:var(--serif);
  font-size:13px;
  color:var(--ink-2);
  font-style:italic;
}
.home-hero .date{font-family:var(--serif);font-weight:300;font-size:34px;line-height:1.15;letter-spacing:-.015em}
.home-hero .date small{font-size:18px;color:var(--ink-3);margin-left:6px;font-weight:300}
.home-hero .weekday{color:var(--ink-3);font-size:12.5px;letter-spacing:.04em;margin-top:4px}

.section{margin-top:22px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:0 4px 10px}
.section-head .section-title{margin:0}
.section-head .right{font-size:11.5px;color:var(--ink-3);letter-spacing:.04em}

.tile{
  background:var(--surface);
  border-radius:var(--radius);
  padding:16px 18px;
  border:1px solid var(--line-2);
  box-shadow:var(--shadow-sm);
}
.tile .label{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:8px}
.tile .body{font-size:14.5px;color:var(--ink);line-height:1.55}
.tile .body.serif{font-family:var(--serif);font-size:16px;font-weight:300}

.focus-tile{
  background:linear-gradient(170deg, var(--blue-soft) 0%, var(--blue-tint) 100%);
  border:1px solid #C9D6EA;
}
.focus-tile .label{color:var(--blue-deep)}
.focus-tile .body{color:var(--ink)}

.pain-tile{border-color:#E8DCC4;background:linear-gradient(170deg, #FBF5EA 0%, #F6EEDD 100%)}
.pain-tile .label{color:var(--amber)}
.pain-tile .body{color:var(--ink)}

.growth-tile{border-color:#D5E1D9;background:linear-gradient(170deg, #F2F7F3 0%, #E9F1EC 100%)}
.growth-tile .label{color:var(--green)}
.growth-tile .body{color:var(--ink)}

/* Lists */
.list{display:flex;flex-direction:column;gap:10px}
.row{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--surface);
  border:1px solid var(--line-2);
  border-radius:var(--radius-sm);
  padding:14px 16px;
  box-shadow:var(--shadow-sm);
  cursor:pointer;
  transition:transform .15s ease;
}
.row:active{transform:scale(.997)}
.row .left{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.row .name{font-weight:500;color:var(--ink);font-size:15px}
.row .meta{font-size:12px;color:var(--ink-3);margin-top:2px}
.row .chev{color:var(--ink-4);font-size:18px;line-height:1}
.tag{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11px;letter-spacing:.04em;
  background:var(--surface-2);
  color:var(--ink-2);
  padding:3px 9px;
  border-radius:999px;
  border:1px solid var(--line);
}
.tag.blue{background:var(--blue-tint);color:var(--blue-deep);border-color:#D4E0F0}
.tag.amber{background:var(--amber-soft);color:#7C582C;border-color:#ECDDC0}
.tag.green{background:var(--green-soft);color:#345640;border-color:#CFE0D5}
.tag.violet{background:var(--violet-soft);color:#4F406E;border-color:#D7CFEA}

/* Task detail */
.task-hero{
  background:var(--surface);
  border:1px solid var(--line-2);
  border-radius:var(--radius);
  padding:20px 20px 16px;
  box-shadow:var(--shadow-sm);
  margin-bottom:14px;
}
.task-hero .name{
  font-family:var(--serif);font-weight:400;font-size:26px;letter-spacing:-.01em;
}
.task-hero .stage{color:var(--blue-deep);font-size:13px;letter-spacing:.06em;margin-top:6px}
.task-hero .meta-line{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.task-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.task-field{
  background:var(--surface);
  border:1px solid var(--line-2);
  border-radius:var(--radius-sm);
  padding:12px 14px;
}
.task-field.full{grid-column:1/-1}
.task-field .l{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:5px}
.task-field .v{font-size:14px;color:var(--ink);line-height:1.5}
.task-field .v.empty{color:var(--ink-4);font-style:italic}

/* Timeline */
.timeline{display:flex;flex-direction:column;gap:14px;margin-top:6px}
.t-entry{
  position:relative;
  padding-left:22px;
}
.t-entry::before{
  content:"";
  position:absolute;left:6px;top:8px;bottom:-14px;
  width:1px;background:var(--line);
}
.t-entry:last-child::before{display:none}
.t-dot{
  position:absolute;left:0;top:6px;
  width:12px;height:12px;border-radius:50%;
  background:var(--surface);border:2px solid var(--blue);
}
.t-dot.fact{background:var(--blue);}
.t-dot.feeling{background:var(--violet);border-color:var(--violet);}
.t-dot.analysis{background:var(--green);border-color:var(--green);}

.t-card{
  background:var(--surface);
  border:1px solid var(--line-2);
  border-radius:var(--radius-sm);
  padding:14px 16px;
  box-shadow:var(--shadow-sm);
  cursor:pointer;
}
.t-date{
  font-family:var(--serif);
  font-weight:500;
  font-size:15px;
  color:var(--ink);
  display:flex;align-items:center;gap:8px;
}
.t-date .lens{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);font-family:var(--sans);font-weight:600;margin-left:6px}
.t-rows{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.t-row{display:grid;grid-template-columns:82px 1fr;gap:8px;font-size:14px}
.t-row .k{color:var(--ink-3);font-size:12px;letter-spacing:.04em}
.t-row .v{color:var(--ink);line-height:1.5;white-space:pre-wrap;word-break:break-word}
.t-row .v.empty{color:var(--ink-4);font-style:italic}
.t-scores{display:flex;gap:14px;margin-top:10px;color:var(--ink-2);font-size:12.5px}
.t-scores .score{display:flex;align-items:center;gap:6px}
.t-scores .score .num{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

/* Forms / New Log */
.sheet{
  background:var(--surface);
  border:1px solid var(--line-2);
  border-radius:var(--radius);
  padding:8px 18px 18px;
  box-shadow:var(--shadow-sm);
}
.field{margin-top:14px}
.field label{display:block;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:6px}
.field .hint{font-size:12px;color:var(--ink-3);margin-top:6px;line-height:1.5}
.input,.textarea,.select{
  width:100%;
  background:#FBFCFE;
  border:1px solid var(--line);
  border-radius:var(--radius-xs);
  padding:12px 14px;
  font-size:15px;
  color:var(--ink);
  outline:none;
  transition:border-color .15s ease, background .15s ease;
}
.input:focus,.textarea:focus,.select:focus{border-color:var(--blue);background:#fff}
.textarea{min-height:82px;resize:vertical;line-height:1.55}

.seg{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--surface-2);border-radius:999px;padding:3px;border:1px solid var(--line)}
.seg button{
  padding:9px 0;
  border-radius:999px;
  font-size:13px;
  font-weight:500;
  color:var(--ink-2);
  letter-spacing:.04em;
  transition:background .15s ease, color .15s ease;
}
.seg button.on.fact{background:var(--blue);color:#fff}
.seg button.on.feeling{background:var(--violet);color:#fff}
.seg button.on.analysis{background:var(--green);color:#fff}

.slider-row{display:flex;align-items:center;gap:12px}
.slider-row .val{
  font-family:var(--serif);font-weight:500;font-size:24px;color:var(--ink);
  width:38px;text-align:right;font-variant-numeric:tabular-nums;
}
.slider{
  -webkit-appearance:none;appearance:none;
  flex:1;height:6px;border-radius:999px;
  background:linear-gradient(90deg, var(--blue-soft), var(--blue-soft));
  outline:none;
}
.slider::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:24px;height:24px;border-radius:50%;background:var(--blue);
  border:3px solid #fff;box-shadow:0 1px 4px rgba(20,35,55,.18);
}
.slider::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--blue);border:3px solid #fff}

.actions{display:flex;gap:10px;margin-top:18px}
.btn{
  flex:1;display:inline-flex;align-items:center;justify-content:center;
  padding:13px 16px;border-radius:14px;font-weight:500;font-size:15px;
  letter-spacing:.01em;transition:transform .12s ease, background .12s ease;
}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 4px 14px rgba(74,111,165,.25)}
.btn-primary:active{background:var(--blue-deep)}
.btn-ghost{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.btn-danger{background:#fff;color:#9B4040;border:1px solid #EBC9C9}

/* Edit sheet (task fields) */
.edit-grid{display:grid;gap:10px}
.edit-grid label{font-size:12px;color:var(--ink-2)}
.edit-grid input,.edit-grid textarea{
  width:100%;border:1px solid var(--line);background:#FBFCFE;
  border-radius:var(--radius-xs);padding:10px 12px;font-size:14px;outline:none;
}
.edit-grid input:focus,.edit-grid textarea:focus{border-color:var(--blue);background:#fff}
.edit-grid textarea{min-height:64px;line-height:1.5}

/* Log view segments */
.segments{
  display:flex;background:var(--surface-2);
  border-radius:999px;padding:4px;border:1px solid var(--line);
  margin:6px 0 16px;
}
.segments button{
  flex:1;padding:9px 0;border-radius:999px;
  font-size:13px;font-weight:500;color:var(--ink-2);letter-spacing:.04em;
}
.segments button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow-sm)}

.filter-bar{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:8px;scrollbar-width:none}
.filter-bar::-webkit-scrollbar{display:none}
.chip{
  flex:none;padding:7px 13px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);
  font-size:12.5px;color:var(--ink-2);letter-spacing:.02em;
}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}

/* Progress view */
.before-after{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.ba-card{
  background:var(--surface);
  border:1px solid var(--line-2);
  border-radius:var(--radius-sm);
  padding:14px 16px;
}
.ba-card .h{font-family:var(--serif);font-size:17px;font-weight:400;color:var(--ink);margin-bottom:8px}
.ba-card .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ba-card .pair .cell{
  background:var(--blue-mist);
  border:1px solid #DEE6F1;
  border-radius:10px;
  padding:10px 12px;
}
.ba-card .pair .cell.after{background:#F1F7F2;border-color:#D9E5DD}
.ba-card .pair .cell .l{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:var(--ink-3);margin-bottom:4px}
.ba-card .pair .cell .t{font-size:13.5px;color:var(--ink);line-height:1.5}
.ba-card .pair .cell.before .l{color:var(--ink-3)}
.ba-card .pair .cell.after .l{color:var(--green)}

/* Trend chart */
.chart-wrap{
  background:var(--surface);
  border:1px solid var(--line-2);
  border-radius:var(--radius-sm);
  padding:14px 14px 10px;
}
.chart-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.chart-head .name{font-family:var(--serif);font-size:15px;color:var(--ink)}
.chart-head .legend{display:flex;gap:12px;font-size:11.5px;color:var(--ink-2)}
.chart-head .legend .l{display:flex;align-items:center;gap:5px}
.chart-head .legend .sw{width:10px;height:2px;border-radius:2px}
.chart-svg{width:100%;height:140px;display:block}
.chart-svg .axis{stroke:var(--line);stroke-width:1}
.chart-svg .grid{stroke:var(--line-2);stroke-width:1}
.chart-svg .pt-energy{stroke:var(--blue);fill:#fff;stroke-width:2}
.chart-svg .pt-focus{stroke:var(--violet);fill:#fff;stroke-width:2}

/* Insights */
.insight-card{
  background:var(--surface);
  border:1px solid var(--line-2);
  border-radius:var(--radius);
  padding:16px 18px;
  box-shadow:var(--shadow-sm);
}
.insight-card .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.insight-card .head .task{font-family:var(--serif);font-size:17px;color:var(--ink)}
.insight-card .head .count{
  font-family:var(--serif);font-size:22px;color:var(--blue);font-variant-numeric:tabular-nums;
}
.insight-card .desc{font-size:14px;color:var(--ink);line-height:1.55;margin-bottom:10px}
.insight-card .row-line{display:flex;gap:8px;flex-wrap:wrap}
.insight-card .row-line .meta{font-size:12px;color:var(--ink-2);line-height:1.5}
.insight-card .row-line .meta .k{color:var(--ink-3);font-weight:500}

.status-pill{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11.5px;letter-spacing:.06em;padding:3px 9px;border-radius:999px;
  border:1px solid var(--line);
}
.status-pill .d{width:6px;height:6px;border-radius:50%}
.status-pill.open{color:var(--amber);background:var(--amber-soft);border-color:#E7D2B0}
.status-pill.open .d{background:var(--amber)}
.status-pill.testing{color:var(--blue);background:var(--blue-tint);border-color:#CADBEF}
.status-pill.testing .d{background:var(--blue)}
.status-pill.resolved{color:var(--green);background:var(--green-soft);border-color:#CCDCCF}
.status-pill.resolved .d{background:var(--green)}

.empty{
  text-align:center;color:var(--ink-3);font-size:13px;padding:20px 14px;
  background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius-sm);
}

/* Nav */
.nav{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:0;width:100%;max-width:480px;
  background:rgba(255,255,255,.86);
  backdrop-filter:saturate(140%) blur(18px);
  -webkit-backdrop-filter:saturate(140%) blur(18px);
  border-top:1px solid var(--line);
  box-shadow:var(--shadow-nav);
  display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px 6px calc(env(safe-area-inset-bottom, 0px) + 6px);
  z-index:50;
}
.nav-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;padding:8px 4px;color:var(--ink-3);font-size:10.5px;letter-spacing:.04em;
  border-radius:12px;
}
.nav-btn .ico{width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.nav-btn.on{color:var(--blue-deep)}
.nav-btn.fab{
  position:relative;margin-top:-22px;
}
.nav-btn.fab .ico{
  width:50px;height:50px;border-radius:50%;
  background:var(--blue);
  color:#fff;
  box-shadow:0 6px 16px rgba(74,111,165,.35), inset 0 -2px 0 rgba(0,0,0,.05);
}
.nav-btn.fab.on .ico{background:var(--blue-deep)}

/* Toast */
.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 18px);
  background:var(--ink);color:#fff;font-size:13px;
  padding:10px 16px;border-radius:999px;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;
  transition:opacity .2s ease, transform .2s ease;
  z-index:60;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

/* Misc */
.spacer-sm{height:8px}
.spacer-md{height:16px}
.spacer-lg{height:28px}
.center{text-align:center}
.notes{font-size:12.5px;color:var(--ink-3);line-height:1.6}

/* Header w/ back */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  margin:2px 0 14px;
}
.topbar .back{
  width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  color:var(--ink-2);background:var(--surface);border:1px solid var(--line);
}
.topbar .title{font-family:var(--serif);font-size:18px;color:var(--ink);font-weight:500}

/* Weekly review */
.review-grid{display:grid;gap:10px}
.review-card{
  background:var(--surface);
  border:1px solid var(--line-2);
  border-radius:var(--radius);
  padding:18px 18px;
  box-shadow:var(--shadow-sm);
}
.review-card .h{font-family:var(--serif);font-size:18px;color:var(--ink);margin-bottom:4px}
.review-card .sub{font-size:12px;color:var(--ink-3);margin-bottom:12px}
.review-card .q{margin-top:10px}
.review-card .q .k{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:4px}
.review-card .q .v{font-size:14px;color:var(--ink);line-height:1.55;white-space:pre-wrap}
.review-card .q .v.empty{color:var(--ink-4);font-style:italic}
.review-card .sentence{
  font-family:var(--serif);font-style:italic;font-size:16px;
  color:var(--blue-deep);border-top:1px solid var(--line);margin-top:14px;padding-top:12px;
}

/* Inline tag selector for task edit status */
.status-row{display:flex;gap:6px;flex-wrap:wrap}

/* Animations & util */
.fadein{animation:fade .28s ease both}
.hide{display:none !important}
.scroll-x{overflow-x:auto;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}
  </style>
</head>

  // ---------- router ----------
  function parseHash(){
    const h = (location.hash||'#/home').replace(/^#/,'');
    const [path, qs] = h.split('?');
    const params = {};
    if (qs) qs.split('&').forEach(p=>{ if(!p) return; const [k,v='']=p.split('='); params[k]=decodeURIComponent(v); });
    return { path: path||'/home', params };
  }
  function go(path, params){
    let q = '';
    if (params) q = '?'+Object.entries(params).filter(([,v])=>v!==''&&v!=null).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
    location.hash = path + q;
  }
  function activeKey(path){
    if (path==='/'||path==='/home') return 'home';
    if (path==='/tasks'||path==='/task') return 'tasks';
    if (path==='/new') return 'new';
    if (path==='/log') return 'log';
    if (path==='/insights'||path==='/weekly') return 'insights';
    return 'home';
  }
  function renderNav(path){
    const tabs = [
      { key:'home',     label:'首页',     path:'/home',     icon:ICON.home },
      { key:'tasks',    label:'任务',    path:'/tasks',    icon:ICON.list },
      { key:'new',      label:'',         path:'/new',      icon:ICON.plus, fab:true },
      { key:'log',      label:'记录',      path:'/log',      icon:ICON.clock },
      { key:'insights', label:'洞察', path:'/insights', icon:ICON.bulb }
    ];
    const active = activeKey(path);
    const html = tabs.map(t=>'<button class="nav-btn '+(t.fab?'fab':'')+' '+(t.key===active?'on':'')+'" data-go="'+t.path+'" aria-label="'+(t.label||'新建记录')+'"><span class="ico">'+t.icon+'</span>'+(t.label?'<span>'+t.label+'</span>':'')+'</button>').join('');
    $('#nav').innerHTML = html;
  }

  // ---------- trend chart (inline SVG) ----------
  function trendChart(logs){
    const w=320, h=140, pad=20;
    const data = logs.map(l=>({ date:l.date, e:l.energy||null, f:l.focus||null }));
    const xPos = i => pad + (data.length<=1? (w-pad*2)/2 : (i/(data.length-1))*(w-pad*2));
    const yPos = v => h-pad - ((v-1)/9)*(h-pad*2);
    const path = key => {
      const pts = data.map((d,i)=> d[key]!=null? [xPos(i), yPos(d[key])] : null).filter(Boolean);
      if (pts.length < 2) return '';
      return 'M '+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L ');
    };
    const dots = key => data.map((d,i)=> d[key]!=null? '<circle cx="'+xPos(i).toFixed(1)+'" cy="'+yPos(d[key]).toFixed(1)+'" r="3.6" fill="'+(key==='e'?'#4A6FA5':'#7868A0')+'" stroke="#fff" stroke-width="1.5"/>' : '').join('');
    return ''+
      '<svg class="chart-svg" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+
        '<line x1="'+pad+'" y1="'+(h-pad)+'" x2="'+(w-pad)+'" y2="'+(h-pad)+'" stroke="#E3E9F1" stroke-width="1"/>'+
        [3,5,7,9].map(v=>'<line x1="'+pad+'" y1="'+yPos(v).toFixed(1)+'" x2="'+(w-pad)+'" y2="'+yPos(v).toFixed(1)+'" stroke="#EDF1F6" stroke-dasharray="2 5"/>').join('')+
        '<path d="'+path('e')+'" fill="none" stroke="#4A6FA5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'+
        '<path d="'+path('f')+'" fill="none" stroke="#7868A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'+
        dots('e')+dots('f')+
        '<text x="'+pad+'" y="'+(h-4)+'" font-size="9.5" fill="#8A98AA" font-family="Inter">'+(data[0]?esc(data[0].date.slice(5)):'')+'</text>'+
        '<text x="'+(w-pad)+'" y="'+(h-4)+'" font-size="9.5" fill="#8A98AA" font-family="Inter" text-anchor="end">'+(data.length? esc(data[data.length-1].date.slice(5)) : '')+'</text>'+
      '</svg>';
  }

  // ---------- shared bits ----------
  function rowItem(k, v){
    const empty = !trim(v);
    return '<div class="t-row"><div class="k">'+k+'</div><div class="v '+(empty?'empty':'')+'">'+esc(v||'\u2014')+'</div></div>';
  }
  function timelineEntry(l, editable){
    const lens = l.lens || 'fact';
    const lensLabel = LENS_LABEL[lens] || lens;
    const t = state.tasks.find(x=>x.id===l.taskId);
    const editAttr = editable? 'data-act="edit-log" data-id="'+l.id+'"' : '';
    return ''+
      '<div class="t-entry">'+
        '<div class="t-dot '+lens+'"></div>'+
        '<div class="t-card" '+editAttr+'>'+
          '<div class="t-date">'+esc(fmtMD(parseISO(l.date)))+' <span class="lens">'+lensLabel+'</span>'+(t? ' \u00b7 '+esc(t.name) : '')+'</div>'+
          '<div class="t-rows">'+
            rowItem('做了', l.whatDid)+
            rowItem('发现', l.whatChanged)+
            rowItem('问题', l.difficulty)+
            rowItem('调整', l.nextAdjust)+
            rowItem('证据', l.evidence)+
            rowItem('感受', l.feeling)+
          '</div>'+
          ((l.energy||l.focus) ? '<div class="t-scores">'+(l.energy? '<div class="score">精力 <span class="num">'+l.energy+'</span>/10</div>':'')+(l.focus? '<div class="score">专注 <span class="num">'+l.focus+'</span>/10</div>':'')+'</div>' : '')+
        '</div>'+
      '</div>';
  }

  function viewHome(){
    const today = todayISO();
    const date = parseISO(today);
    const weekday = fmtWeekday(today);

    // tasks with logs today, or most recent active tasks
    const todayLogs = state.logs.filter(l => l.date === today);
    const todayTaskIds = Array.from(new Set(todayLogs.map(l=>l.taskId)));
    const todayTasks = todayTaskIds.length
      ? todayTaskIds.map(id => state.tasks.find(t=>t.id===id)).filter(Boolean)
      : state.tasks.slice().sort((a,b)=> (b.updatedAt||'').localeCompare(a.updatedAt||'')).slice(0,4);

    // current focus: most recently updated task with focus/pain set
    const focusTask = state.tasks.slice().sort((a,b)=> (b.updatedAt||'').localeCompare(a.updatedAt||''))[0];

    // recent progress: logs with whatChanged in latest first
    const recentLogs = state.logs.slice().sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||'')).filter(l=> trim(l.whatChanged)).slice(0,5);

    // today I noticed: most recent log (any)
    const allSorted = state.logs.slice().sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));
    const lastLog = allSorted[0];

    // current pain point: task with most difficulty entries in last 30 days
    const cutoff = new Date(date.getTime() - 30*86400000).toISOString().slice(0,10);
    const pains = state.tasks.map(t => ({
      task:t,
      count: state.logs.filter(l => l.taskId===t.id && trim(l.difficulty) && l.date >= cutoff).length
    })).filter(x => x.count > 0).sort((a,b)=> b.count - a.count);
    const topPain = pains[0];

    return ''+
      '<div class="brand">'+
        '<div class="mark">MY <span>WORK BUDDY</span></div>'+
        '<div class="right">v1</div>'+
      '</div>'+
      '<div class="home-hero">'+
        '<div class="greeting">今天，'+weekday+'。</div>'+
        '<div class="date">'+date.getDate()+' <small>'+(date.getMonth()+1)+'月 '+date.getFullYear()+'</small></div>'+
        '<div class="weekday">安静的一天，记录真实发生的事。</div>'+
      '</div>'+

      '<section class="section">'+
        '<div class="section-head"><div class="section-title"><span class="dot"></span>今日</div><div class="right">'+todayLogs.length+' 条记录</div></div>'+
        (todayTasks.length ? '<div class="list">'+todayTasks.map(t => ''+
          '<div class="row" data-go="/task?id='+t.id+'">'+
            '<div class="left">'+
              '<div>'+
                '<div class="name">'+esc(t.name)+'</div>'+
                '<div class="meta">'+esc(t.area||'\u2014')+' \u00b7 '+esc(t.stage||'\u2014')+'</div>'+
              '</div>'+
            '</div>'+
            '<div class="chev">\u203a</div>'+
          '</div>').join('')+'</div>' : '<div class="empty">今天还没有记录。点击 + 记录你做的事。</div>')+
      '</section>'+

      (focusTask ? ''+
      '<section class="section">'+
        '<div class="section-head"><div class="section-title"><span class="dot"></span>当前重点</div><div class="right" data-go="/task?id='+focusTask.id+'" style="cursor:pointer;color:var(--blue-deep)">'+esc(focusTask.name)+' \u203a</div></div>'+
        '<div class="tile focus-tile">'+
          '<div class="label">'+esc(focusTask.name)+'</div>'+
          '<div class="body serif">'+esc(focusTask.focus||'\u2014 为这个任务设置当前重点。')+'</div>'+
          '<div class="muted" style="margin-top:8px;font-size:12.5px">阶段 \u00b7 '+esc(focusTask.stage||'\u2014')+'</div>'+
        '</div>'+
      '</section>' : '')+

      '<section class="section">'+
        '<div class="section-head"><div class="section-title"><span class="dot"></span>近期进展</div></div>'+
        (recentLogs.length ? '<div class="list">'+recentLogs.map(l => {
          const t = state.tasks.find(x=>x.id===l.taskId);
          return '<div class="row" data-act="edit-log" data-id="'+l.id+'">'+
            '<div class="left"><div>'+
              '<div class="name" style="font-weight:500">'+esc(t?t.name:'')+'</div>'+

        '<div class="tile">'+

    const ev = state.evidence.filter(e=>e.taskId===id);
    const fields = [
      { k:'stage',     l:'当前阶段', full:true },
      { k:'focus',     l:'当前重点', full:true },
      { k:'pain',      l:'当前痛点', full:true },
      { k:'strategy',  l:'当前策略', full:true },
      { k:'milestone', l:'下一个里程碑', full:true },
      { k:'area',      l:'领域' }

    return ''+
      '<div class="topbar">'+
        '<button class="back" data-go="/tasks" aria-label="返回">'+ICON.back+'</button>'+

        '<div class="name">'+esc(t.name.toUpperCase())+'</div>'+

      '<div class="task-fields">'+

            '<div class="v '+(t[f.k]?'':'empty')+'">'+esc(t[f.k]||'\u2014 暂未设置')+'</div>'+

    const last = state.logs.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt))[0];
    const presetTask = p.task || (editing? editing.taskId : (last? last.taskId : (state.tasks[0]? state.tasks[0].id : '')));
    const l = editing || { date: todayISO(), taskId: presetTask, whatDid:'', evidence:'', difficulty:'', feeling:'', energy:5, focus:5, whatChanged:'', nextAdjust:'', lens:'fact' };
    const isEdit = !!editing;
    return ''+
      '<div class="topbar">'+
        '<button class="back" data-go="'+(isEdit?'/task?id='+l.taskId:'/log')+'" aria-label="返回">'+ICON.back+'</button>'+
        '<div class="title">'+(isEdit?'编辑记录':'新建记录')+'</div>'+
        '<div style="width:36px"></div>'+
      '</div>'+
      '<div class="sheet">'+
        '<div class="field"><label>日期</label><input class="input" type="date" id="f-date" value="'+esc(l.date)+'"></div>'+
        '<div class="field"><label>任务</label><select class="select" id="f-task">'+state.tasks.map(t => '<option value="'+t.id+'" '+(t.id===l.taskId?'selected':'')+'>'+esc(t.name)+'</option>').join('')+'</select></div>'+

      '<div class="brand"><div class="mark">我的<span>记录</span></div><div class="right">'+state.logs.length+' 条记录</div></div>'+

    const taskChips = '<button class="chip '+(!taskFilter?'on':'')+'" data-go="/log?seg=timeline">全部</button>' + state.tasks.map(t => '<button class="chip '+(taskFilter===t.id?'on':'')+'" data-go="/log?seg=timeline&task='+t.id+'">'+esc(t.name)+'</button>').join('');

      '<div class="filter-bar">'+taskChips+'</div>'+
      (logs.length ? '<div class="timeline">'+logs.map(l => timelineEntry(l, true)).join('')+'</div>' : '<div class="empty">还没有记录。点击 + 记录第一条。</div>');

        (evAll.length ? '<div class="list">'+evAll.slice(0,6).map(ev => {
          const t = state.tasks.find(x=>x.id===ev.taskId);
          return '<div class="insight-card">'+
            '<div class="head"><div class="task">'+esc(t?t.name:'')+' \u00b7 '+esc(ev.ability)+'</div><div class="fine">'+esc(ev.date)+'</div></div>'+

            '<div class="desc">'+x.items.slice().reverse().map((l,i)=> (x.items.length-i)+'. '+esc(l.nextAdjust)+' <span class="dim" style="font-size:12px">（'+esc(l.date)+'）</span>').join('<br>')+'</div>'+

  function render(){
    const { path, params } = parseHash();
    let html;
    if (path === '/home') html = viewHome();
    else if (path === '/tasks') html = viewTasks();
    else if (path === '/task') html = viewTaskDetail(params.id);
    else if (path === '/new') html = viewNewLog(params);
    else if (path === '/log') html = viewLog(params);
    else if (path === '/insights') html = viewInsights(params);
    else if (path === '/weekly') html = viewWeekly(params);
    else html = viewHome();
    $('#app').innerHTML = '<div class="view fadein">'+html+'</div>';
    renderNav(path);
    attachHandlers();
    window.scrollTo(0,0);
  }
  // ============================================================
  // ACTIONS · MODAL · INIT
  // ============================================================

  // global click delegation (set up once)
  function onClick(e){
    const goBtn = e.target.closest('[data-go]');
    if (goBtn && !goBtn.disabled){ e.preventDefault(); go(goBtn.dataset.go); return; }
    const actBtn = e.target.closest('[data-act]');
    if (actBtn){ e.preventDefault(); handleAction(actBtn); return; }
  }

  function handleAction(b){
    const act = b.dataset.act;
    if (act === 'save-log') return saveLog(b.dataset.id || '');
    if (act === 'delete-log') return deleteLog(b.dataset.id);
    if (act === 'add-task') return openAddTask();
    if (act === 'edit-task') return openEditTask(b.dataset.id);
    if (act === 'add-evidence') return openAddEvidence(b.dataset.id);
    if (act === 'del-evidence') return delEvidence(b.dataset.id);
    if (act === 'edit-log') return go('/new?id='+b.dataset.id);
    if (act === 'set-pain'){ state.painStatus[b.dataset.id] = b.dataset.status; saveAll(); toast('痛点状态已更新。'); render(); return; }
    if (act === 'save-review') return saveReview(b.dataset.week);
  }

  // ---------- modal ----------
  function openModal(contentHTML, onMount){
    const ov = document.createElement('div');
    ov.className = 'modal-overlay';
    ov.innerHTML = '<div class="modal" role="dialog">'+contentHTML+'</div>';
    document.body.appendChild(ov);
    document.body.style.overflow = 'hidden';
    const close = () => { ov.remove(); document.body.style.overflow = ''; };
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    if (onMount) onMount(ov, close);
    return close;
  }

  function openAddTask(){
    const html = ''+
      '<div class="head"><div class="t">新建任务</div><button class="close" data-modal-close>'+ICON.x+'</button></div>'+
      '<div class="edit-grid">'+
        '<div><label>名称</label><input id="m-name" class="input" placeholder="如：发音"></div>'+
        '<div><label>领域（可选）</label><input id="m-area" class="input" placeholder="如：输出"></div>'+
        '<div><label>当前阶段（可选）</label><input id="m-stage" class="input" placeholder="如：认知 → 运用"></div>'+
      '</div>'+
      '<div class="actions"><button class="btn btn-ghost" data-modal-close>取消</button><button class="btn btn-primary" id="m-add">添加任务</button></div>';
    openModal(html, (ov, close) => {
      ov.querySelectorAll('[data-modal-close]').forEach(b => b.addEventListener('click', close));
      const nameI = ov.querySelector('#m-name');
      setTimeout(()=> nameI.focus(), 60);
      const submit = () => {
        const name = nameI.value.trim();
        if (!name){ nameI.focus(); return; }
        const now = new Date().toISOString();
        const t = { id: uid(), name, area: ov.querySelector('#m-area').value.trim(), stage: ov.querySelector('#m-stage').value.trim(), focus:'', pain:'', strategy:'', milestone:'', status:'active', createdAt: now, updatedAt: now };
        state.tasks.push(t);
        saveAll();
        close();
        toast('任务已添加。');
        go('/task?id='+t.id);
      };
      ov.querySelector('#m-add').addEventListener('click', submit);
      nameI.addEventListener('keydown', e => { if (e.key==='Enter') submit(); });
    });
  }

  function openEditTask(id){
    const t = state.tasks.find(x=>x.id===id);
    if (!t) return;
    const fields = ['area','stage','focus','pain','strategy','milestone','status'];
    const labels = {area:'领域',stage:'当前阶段',focus:'当前重点',pain:'当前痛点',strategy:'当前策略',milestone:'下一个里程碑',status:'状态'};
    const html = ''+
      '<div class="head"><div class="t">编辑 \u00b7 '+esc(t.name)+'</div><button class="close" data-modal-close>'+ICON.x+'</button></div>'+
      '<div class="edit-grid">'+
        fields.map(k => ''+
          '<div><label>'+labels[k]+'</label>'+
            (k==='status'
              ? '<select id="e-'+k+'" class="select"><option value="active" '+(t[k]==='active'?'selected':'')+'>进行中</option><option value="paused" '+(t[k]==='paused'?'selected':'')+'>暂停</option><option value="archived" '+(t[k]==='archived'?'selected':'')+'>归档</option></select>'
              : '<textarea id="e-'+k+'" rows="'+(['focus','pain','strategy','milestone'].includes(k)?2:1)+'">'+esc(t[k]||'')+'</textarea>'
            )+
          '</div>').join('')+
      '</div>'+
      '<div class="actions"><button class="btn btn-ghost" data-modal-close>取消</button><button class="btn btn-primary" id="m-save-task">保存</button></div>';
    openModal(html, (ov, close) => {
      ov.querySelectorAll('[data-modal-close]').forEach(b => b.addEventListener('click', close));
      ov.querySelector('#m-save-task').addEventListener('click', () => {
        fields.forEach(k => { const el = ov.querySelector('#e-'+k); if (el) t[k] = el.value.trim(); });
        t.updatedAt = new Date().toISOString();
        saveAll();
        close();
        toast('任务已更新。');
        render();
      });

  function openAddEvidence(taskId){
    const t = state.tasks.find(x=>x.id===taskId);
    if (!t) return;
    const html = ''+
      '<div class="head"><div class="t">添加证据 \u00b7 '+esc(t.name)+'</div><button class="close" data-modal-close>'+ICON.x+'</button></div>'+
      '<div class="muted" style="font-size:12.5px;margin-bottom:10px">一个具体的前后对比。三个字段都需要填写。</div>'+
      '<div class="edit-grid">'+
        '<div><label>能力</label><input id="m-ability" class="input" placeholder="如：连续表达"></div>'+
        '<div><label>之前</label><textarea id="m-before" class="textarea" rows="2" placeholder="之前是什么样"></textarea></div>'+
        '<div><label>之后</label><textarea id="m-after" class="textarea" rows="2" placeholder="现在是什么样"></textarea></div>'+
      '</div>'+
      '<div class="actions"><button class="btn btn-ghost" data-modal-close>取消</button><button class="btn btn-primary" id="m-save-ev">保存</button></div>';
    openModal(html, (ov, close) => {
      ov.querySelectorAll('[data-modal-close]').forEach(b => b.addEventListener('click', close));
      setTimeout(()=> ov.querySelector('#m-ability').focus(), 60);
      ov.querySelector('#m-save-ev').addEventListener('click', () => {
        const ability = ov.querySelector('#m-ability').value.trim();
        const before = ov.querySelector('#m-before').value.trim();
        const after = ov.querySelector('#m-after').value.trim();
        if (!ability || !before || !after){ toast('三个字段都需要填写。'); return; }
        state.evidence.push({ id: uid(), taskId, ability, before, after, date: todayISO(), createdAt: new Date().toISOString() });
        saveAll();
        close();
        toast('证据已添加。');
        render();
      });

  function delEvidence(id){
    state.evidence = state.evidence.filter(x=>x.id!==id);
    saveAll();
    toast('已移除。');
    render();
  }

  // ---------- log actions ----------
  function saveLog(id){
    const data = {
      date: ($('#f-date')||{}).value || todayISO(),
      taskId: ($('#f-task')||{}).value,
      whatDid: trim(($('#f-did')||{}).value),
      evidence: trim(($('#f-evi')||{}).value),
      difficulty: trim(($('#f-diff')||{}).value),
      feeling: trim(($('#f-feel')||{}).value),
      energy: +(($('#f-energy')||{}).value || 5),
      focus: +(($('#f-focus')||{}).value || 5),
      whatChanged: trim(($('#f-changed')||{}).value),
      nextAdjust: trim(($('#f-adjust')||{}).value),
      lens: ((document.querySelector('#f-lens button.on')||{}).dataset||{}).lens || 'fact'
    };
    if (!data.taskId){ toast('请选择一个任务。'); return; }
    const now = new Date().toISOString();
    if (id){
      const i = state.logs.findIndex(l=>l.id===id);
      if (i<0) return;
      state.logs[i] = Object.assign({}, state.logs[i], data, { updatedAt: now });
    } else {
      state.logs.push({ id: uid(), createdAt: now, updatedAt: now, ...data });
    }
    const t = state.tasks.find(x=>x.id===data.taskId);
    if (t) t.updatedAt = now;
    saveAll();
    toast(id ? '记录已更新。' : '已保存到时间线。');
    go('/task?id='+data.taskId);
  }
  function deleteLog(id){
    const l = state.logs.find(x=>x.id===id);
    if (!l) return;
    if (!confirm('删除这条记录？')) return;
    state.logs = state.logs.filter(x=>x.id!==id);
    saveAll();
    toast('记录已删除。');
    go('/task?id='+l.taskId);
  }

  function saveReview(wk){
    const r = state.reviews.find(x=>x.weekKey===wk) || { id: uid(), weekKey: wk, startDate: weekStart(), endDate: weekEnd() };
    r.whatHappened = trim(($('#r-happened')||{}).value);
    r.whatImproved = trim(($('#r-improved')||{}).value);
    r.whatBlocked = trim(($('#r-blocked')||{}).value);
    r.whatWorked = trim(($('#r-worked')||{}).value);
    r.whatDidnt = trim(($('#r-didnt')||{}).value);
    r.whatWillChange = trim(($('#r-change')||{}).value);
    r.sentence = trim(($('#r-sentence')||{}).value);
    r.updatedAt = new Date().toISOString();
    const i = state.reviews.findIndex(x=>x.weekKey===wk);
    if (i<0) state.reviews.push(r); else state.reviews[i] = r;
    saveAll();
    toast('复盘已保存。');
    go('/insights');
  }

  function toast(msg){
    const el = $('#toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(()=> el.classList.remove('show'), 1600);
  }

  // ---------- per-view handlers ----------
  function attachHandlers(){
    // sliders: live update value display
    document.querySelectorAll('.slider').forEach(s => {
      s.addEventListener('input', () => {
        const v = s.parentElement.querySelector('.val');
        if (v) v.textContent = s.value;
      });
    });
    // lens segmented control
    document.querySelectorAll('#f-lens button').forEach(b => {
      b.addEventListener('click', () => {
        document.querySelectorAll('#f-lens button').forEach(x => { x.className = x.dataset.lens; });
        b.className = 'on ' + b.dataset.lens;
      });
    });
  }

  // ---------- init ----------
  function init(){
    loadAll();
    if (!state.tasks.length && !state.logs.length){
      const d = defaults();
      state.tasks = d.tasks;
      state.logs = d.logs;
      state.evidence = d.evidence;
      state.painStatus = d.painStatus;
      saveAll();
      try{ localStorage.setItem(K.seeded,'1'); }catch{}
    }
    document.body.addEventListener('click', onClick);
    window.addEventListener('hashchange', render);
    render();
  }

  init();
})();

  </script>
</body>
</html>
